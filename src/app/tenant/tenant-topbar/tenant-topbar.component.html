<header class="tenant-topbar profile-dropdown">
<!--
  <button class="tenant-topbar__menu-toggle md:hidden" (click)="toggleSidebar.emit()">
    ☰
  </button> -->

  <p class="tenant-topbar__title">AI Assistant Message</p>

  <div class="tenant-topbar__actions">

    <button type="button" class="tenant-topbar__icon-button" aria-label="Search">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
      </svg>
    </button>

    <button type="button" class="tenant-topbar__icon-button" aria-label="Notifications">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0a3 3 0 11-6 0m6 0H9" />
      </svg>
    </button>

    <div class="tenant-topbar__divider"></div>

    <div class="tenant-topbar__profile" (click)="toggleDropdown()">
      <div>
        @if (avatarUrl) {
          <img
            [src]="avatarUrl"
            alt=""
            class="tenant-topbar__avatar"
            width="23"
            height="23"
          />
        } @else {
          <svg width="23" height="23" viewBox="0 0 23 23" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="23" height="23" rx="11.5" fill="#3B3B3B"/>
            <path fill-rule="evenodd" clip-rule="evenodd" d="M14.9501 9.2C14.9501 11.1054 13.4055 12.65 11.5001 12.65C9.59476 12.65 8.05014 11.1054 8.05014 9.2C8.05014 7.29462 9.59476 5.75 11.5001 5.75C13.4055 5.75 14.9501 7.29462 14.9501 9.2ZM13.8001 9.2C13.8001 10.4703 12.7704 11.5 11.5001 11.5C10.2299 11.5 9.20014 10.4703 9.20014 9.2C9.20014 7.92974 10.2299 6.9 11.5001 6.9C12.7704 6.9 13.8001 7.92974 13.8001 9.2Z" fill="white"/>
            <path d="M11.5001 14.375C7.77737 14.375 4.60547 16.5763 3.39722 19.6604C3.69156 19.9527 4.00162 20.2292 4.32603 20.4884C5.22576 17.6569 8.04825 15.525 11.5001 15.525C14.952 15.525 17.7745 17.6569 18.6743 20.4884C18.9987 20.2292 19.3087 19.9527 19.6031 19.6604C18.3948 16.5763 15.2229 14.375 11.5001 14.375Z" fill="white"/>
          </svg>
        }
      </div>

      <div class="tenant-topbar__user-meta">
        <span class="tenant-topbar__username">{{ userName }}</span>
        @if (jobPositionLabel) {
          <span class="tenant-topbar__role" [attr.title]="jobPositionLabel">{{ jobPositionLabel }}</span>
        }
      </div>

      <svg class="tenant-topbar__settings-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
      </svg>
    </div>

    @if (dropdownOpen) {
      <div class="tenant-topbar__dropdown">
        <button type="button" (click)="goToProfile()">
          Profile
        </button>
        <button type="button" (click)="logout()">
          Logout
        </button>
      </div>
    }

  </div>

</header>
