    <!-- Trigger -->
    <div class="flex items-center gap-2 cursor-pointer bg-white shadow-md rounded-xl px-3 py-1" (click)="toggleDropdown()">
      <!-- Image -->
      <div class="">
        <img src="assets/profile-1.png" class="w-[30px] h-[30px]" />
      </div>

      <!-- Name -->
      <span class="text-sm text-gray-700">
        {{ userName }}
      </span>

      <!-- Arrow -->
      <svg class="w-4 h-4 transition-transform duration-200" [class.rotate-180]="dropdownOpen" fill="none"
        stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
      </svg>
    </div>

    <!-- Dropdown -->
    <div *ngIf="dropdownOpen" class="absolute right-[15px] top-[40px] mt-2 w-[110px] bg-white border rounded shadow-md z-50">

      <button class="block w-full text-left px-4 py-2 hover:bg-gray-100" (click)="logout()">
