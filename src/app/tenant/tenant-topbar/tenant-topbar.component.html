<header class="h-14 border-b border-gray-300 bg-[#f5f5f5] flex items-center justify-between px-4"
  style="border-bottom:1px solid #6c71727a;">

  <!-- Left -->
  <!-- <button class="md:hidden text-2xl">☰</button> -->
  <button class="md:hidden text-2xl" (click)="toggleSidebar.emit()">
    ☰
  </button>

  <!-- Title -->
  <div class="font-semibold">
    <h2 class="font-libre font-normal text-[#000000] text-[22px] lg:block md:block sm:hidden">
      AI assistance message
    </h2>
  </div>

  <!-- Right -->
  <div class="relative profile-dropdown px-4 py-2">

    <!-- Trigger -->
    <div class="flex items-center gap-2 cursor-pointer" (click)="toggleDropdown()">
      <!-- Image -->
      <div class="">
        <img src="assets/profile-1.png" class="w-[30px] h-[30px]" />
      </div>

      <!-- Name -->
      <span class="text-sm text-gray-700">
        {{ userName }}
      </span>

      <!-- Arrow -->
      <svg class="w-4 h-4 transition-transform duration-200" [class.rotate-180]="dropdownOpen" fill="none"
        stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
      </svg>
    </div>

    <!-- Dropdown -->
    <div *ngIf="dropdownOpen" class="absolute right-0 mt-2 w-40 bg-white border rounded shadow-md z-50">
      <!-- <button class="block w-full text-left px-4 py-2 hover:bg-gray-100" (click)="goToProfile()">
        Profile
      </button> -->

      <button class="block w-full text-left px-4 py-2 hover:bg-gray-100" (click)="logout()">
        Logout
      </button>
    </div>

  </div>

</header>
