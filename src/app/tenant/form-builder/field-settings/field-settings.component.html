<div class="space-y-4" *ngIf="field">

  <div class="border-b border-slate-100 pb-3">
    <h3 class="text-sm font-semibold text-slate-900">Field Settings</h3>
    <p class="text-xs capitalize text-slate-500">
      {{ field.fieldTypeName || field.type }} field
      <span *ngIf="isFieldHidden" class="font-normal text-amber-600">(hidden on canvas)</span>
    </p>
  </div>

  <div>
    <label class="mb-1.5 block text-xs font-medium text-slate-600">Label</label>
    <input
      type="text"
      [(ngModel)]="field.label"
      (input)="onChange()"
      class="w-full rounded-md border border-slate-200 px-3 py-2 text-sm focus:border-[#0054AC] focus:outline-none focus:ring-1 focus:ring-[#0054AC]"
    />
  </div>

  <div>
    <label class="mb-1.5 block text-xs font-medium text-slate-600">Placeholder</label>
    <input
      type="text"
      [(ngModel)]="field.placeholder"
      (input)="onChange()"
      class="w-full rounded-md border border-slate-200 px-3 py-2 text-sm focus:border-[#0054AC] focus:outline-none focus:ring-1 focus:ring-[#0054AC]"
    />
  </div>

  <div class="space-y-2 rounded-md border border-slate-100 bg-slate-50 px-3 py-2.5">
    <div class="flex items-center gap-2">
      <input
        id="field-required"
        type="checkbox"
        [(ngModel)]="field.required"
        (change)="onChange()"
        class="field-settings-checkbox"
      />
      <label for="field-required" class="text-sm text-slate-700">Required field</label>
    </div>

    <div class="flex items-center gap-2">
      <input
        id="field-is-show"
        type="checkbox"
        [ngModel]="field.isShow !== false"
        (ngModelChange)="onShowChange($event)"
        class="field-settings-checkbox"
      />
      <label for="field-is-show" class="text-sm text-slate-700">Show field</label>
    </div>

    <div class="flex items-center gap-2">
      <input
        id="field-is-readonly"
        type="checkbox"
        [(ngModel)]="field.isReadonly"
        (change)="onChange()"
        class="field-settings-checkbox"
      />
      <label for="field-is-readonly" class="text-sm text-slate-700">Readonly field</label>
    </div>
  </div>

  <div *ngIf="isSelectField" class="space-y-3">
    <div>
      <label class="mb-1.5 block text-xs font-medium text-slate-600">Options source</label>
      <div class="space-y-2 rounded-md border border-slate-100 bg-slate-50 px-3 py-2.5">
        <label class="flex items-center gap-2 text-sm text-slate-700">
          <input
            type="radio"
            name="select-options-mode"
            [checked]="optionsMode === 'static'"
            (change)="setOptionsMode('static')"
            class="field-settings-radio"
          />
          Static Options
        </label>

        <label class="flex items-center gap-2 text-sm text-slate-700">
          <input
            type="radio"
            name="select-options-mode"
            [checked]="optionsMode === 'dynamic'"
            (change)="setOptionsMode('dynamic')"
            class="field-settings-radio"
          />
          Dynamic Options
        </label>
      </div>
    </div>

    <div *ngIf="optionsMode === 'static'">
      <label class="mb-1.5 block text-xs font-medium text-slate-600">Options (one per line)</label>
      <textarea
        rows="5"
        [value]="optionsText"
        (input)="updateOptions($event)"
        class="w-full rounded-md border border-slate-200 px-3 py-2 text-sm focus:border-[#0054AC] focus:outline-none focus:ring-1 focus:ring-[#0054AC]"
      ></textarea>
    </div>

    <div *ngIf="optionsMode === 'dynamic'" class="space-y-3">
      <div>
        <label class="mb-1.5 block text-xs font-medium text-slate-600">Select Module</label>
        <select
          [ngModel]="selectedModuleSlug"
          (ngModelChange)="onModuleChange($event)"
          class="field-settings-select"
        >
          <option [ngValue]="''">Select a module</option>
          <option
            *ngFor="let module of availableModules"
            [ngValue]="getModuleSlug(module)"
          >
            {{ getModuleLabel(module) }}
          </option>
        </select>
        <p *ngIf="modulesLoading" class="mt-1 text-xs text-slate-400">Loading modules...</p>
        <p *ngIf="modulesError" class="mt-1 text-xs text-red-500">{{ modulesError }}</p>
        <p *ngIf="recordsLoading" class="mt-1 text-xs text-slate-400">Loading records...</p>
      </div>

      <div *ngIf="selectedModuleSlug && moduleColumns.length">
        <label class="mb-1.5 block text-xs font-medium text-slate-600">Select Display Column</label>
        <select
          [ngModel]="selectedDisplayColumn"
          (ngModelChange)="onDisplayColumnChange($event)"
          class="field-settings-select"
        >
          <option [ngValue]="''">Select a column</option>
          <option *ngFor="let column of moduleColumns" [ngValue]="column">
            {{ column }}
          </option>
        </select>
      </div>

      <p
        *ngIf="dynamicOptionsCount > 0"
        class="rounded-md border border-slate-100 bg-slate-50 px-3 py-2 text-xs text-slate-600"
      >
        {{ dynamicOptionsCount }} options saved to this field.
      </p>
    </div>
  </div>

  <div *ngIf="field.type === 'radio' || field.type === 'checkbox'">
    <p *ngIf="field.optionSource?.type === 'api'" class="rounded-md border border-slate-100 bg-slate-50 px-3 py-2 text-xs text-slate-500">
      Options loaded from {{ field.optionSource?.endpoint }}
    </p>

    <ng-container *ngIf="field.optionSource?.type !== 'api'">
      <label class="mb-1.5 block text-xs font-medium text-slate-600">Options (one per line)</label>
      <textarea
        rows="5"
        [value]="optionsText"
        (input)="updateOptions($event)"
        class="w-full rounded-md border border-slate-200 px-3 py-2 text-sm focus:border-[#0054AC] focus:outline-none focus:ring-1 focus:ring-[#0054AC]"
      ></textarea>
    </ng-container>
  </div>

  <div class="flex gap-2 border-t border-slate-100 pt-4">
    <button
      type="button"
      class="flex-1 rounded-md border border-slate-200 px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50"
      (click)="onDuplicateClick()"
    >
      Duplicate
    </button>
    <button
      type="button"
      class="flex-1 rounded-md border border-red-200 px-3 py-2 text-sm font-medium text-red-600 hover:bg-red-50"
      (click)="onDeleteClick()"
    >
      Delete
    </button>
  </div>

</div>
