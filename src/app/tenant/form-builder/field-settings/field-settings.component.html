<div class="space-y-4" *ngIf="field">

  <h3 class="text-lg font-bold">
    Field Settings
  </h3>

  <!-- LABEL -->
  <div>
    <label class="block mb-1 text-sm font-medium">
      Label
    </label>

    <input
      type="text"
      [(ngModel)]="field.label"
      (input)="onChange()"
      class="w-full border rounded p-2"
    />
  </div>

  <!-- PLACEHOLDER -->
  <div>
    <label class="block mb-1 text-sm font-medium">
      Placeholder
    </label>

    <input
      type="text"
      [(ngModel)]="field.placeholder"
      (input)="onChange()"
      class="w-full border rounded p-2"
    />
  </div>

  <!-- NAME -->
  <div>
    <label class="block mb-1 text-sm font-medium">
      Name
    </label>

    <input
      type="text"
      [(ngModel)]="field.name"
      (input)="onChange()"
      class="w-full border rounded p-2"
    />
  </div>

  <!-- DEFAULT VALUE -->
  <div>
    <label class="block mb-1 text-sm font-medium">
      Default Value
    </label>

    <input
      type="text"
      [(ngModel)]="field.defaultValue"
      (input)="onChange()"
      class="w-full border rounded p-2"
    />
  </div>

  <!-- WIDTH -->
  <div>
    <label class="block mb-1 text-sm font-medium">
      Width (1-12)
    </label>

    <input
      type="number"
      min="1"
      max="12"
      [(ngModel)]="field.width"
      (input)="onChange()"
      class="w-full border rounded p-2"
    />
  </div>

  <!-- REQUIRED -->
  <div class="flex items-center gap-2">

    <input
      type="checkbox"
      [(ngModel)]="field.required"
      (change)="onChange()"
    />

    <label class="text-sm">
      Required Field
    </label>

  </div>

<!-- OPTIONS EDITOR -->
<div *ngIf="field.type === 'select' || field.type === 'radio' || field.type === 'checkbox'">

  <label class="block text-sm font-medium">
    Options (one per line)
  </label>

  <textarea
    rows="5"
    [value]="optionsText"
    (input)="updateOptions($event)"
    class="w-full border p-2"
  ></textarea>

</div>

<div class="mt-4 border-t pt-3" *ngIf="field.condition">

  <h4 class="font-bold text-sm mb-2">Conditional Logic</h4>

  <label class="text-xs">Show this field when:</label>

  <input
    [(ngModel)]="field.condition.fieldId"
    (input)="onChange()"
    placeholder="Field ID"
    class="w-full border p-2 mt-1 text-sm"
  />

  <input
    [(ngModel)]="field.condition.value"
    (input)="onChange()"
    placeholder="Value"
    class="w-full border p-2 mt-1 text-sm"
  />

</div>

<div class="mt-4 border-t pt-3">

  <h4 class="font-bold text-sm mb-2">Validations (JSON)</h4>

  <textarea
    rows="4"
    [value]="validationsJson"
    (input)="updateValidations($event)"
    class="w-full border p-2 text-sm"
  ></textarea>

</div>

</div>
