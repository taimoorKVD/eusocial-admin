<label class="mb-1 block text-xs font-medium text-slate-500">
  {{ field.label }}
  <span *ngIf="field.required" class="text-red-500">*</span>
  <span *ngIf="isReadonly" class="ml-1 text-[10px] font-normal text-slate-400">(readonly)</span>
</label>

<input
  *ngIf="fieldType === 'text'"
  type="text"
  [placeholder]="field.placeholder"
  [value]="previewValue"
  disabled
  readonly
  tabindex="-1"
  aria-disabled="true"
  class="w-full border-b border-slate-300 bg-transparent py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none disabled:cursor-default disabled:text-slate-500"
/>

<input
  *ngIf="fieldType === 'email'"
  type="email"
  [placeholder]="field.placeholder"
  [value]="previewValue"
  disabled
  readonly
  tabindex="-1"
  aria-disabled="true"
  class="w-full border-b border-slate-300 bg-transparent py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none disabled:cursor-default disabled:text-slate-500"
/>

<input
  *ngIf="fieldType === 'number'"
  type="number"
  [placeholder]="field.placeholder"
  [value]="previewValue"
  disabled
  readonly
  tabindex="-1"
  aria-disabled="true"
  class="w-full border-b border-slate-300 bg-transparent py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none disabled:cursor-default disabled:text-slate-500"
/>

<textarea
  *ngIf="fieldType === 'textarea'"
  [placeholder]="field.placeholder"
  [value]="previewValue"
  disabled
  readonly
  rows="3"
  tabindex="-1"
  aria-disabled="true"
  class="w-full resize-none border-b border-slate-300 bg-transparent py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none disabled:cursor-default disabled:text-slate-500"
></textarea>

<select
  *ngIf="isSelectField"
  [ngModel]="previewValue"
  disabled
  tabindex="-1"
  aria-disabled="true"
  class="w-full border-b border-slate-300 bg-transparent py-2.5 text-sm text-slate-900 focus:outline-none disabled:cursor-default disabled:text-slate-500"
>
  <option *ngIf="loadingOptions" [ngValue]="null" disabled>Loading options...</option>
  <option *ngIf="optionsError && !loadingOptions" [ngValue]="null" disabled>
    Unable to load options
  </option>
  <option
    *ngIf="!loadingOptions && !optionsError && field.placeholder"
    [ngValue]="null"
    disabled
    selected
  >
    {{ field.placeholder }}
  </option>
  <option
    *ngFor="let opt of displayOptions; trackBy: trackByOptionValue"
    [ngValue]="opt.value"
    disabled
  >
    {{ opt.label }}
  </option>
</select>

<div *ngIf="isRadioField" class="mt-1 space-y-2">
  <p *ngIf="loadingOptions" class="text-xs text-slate-400">Loading options...</p>
  <div
    *ngFor="let opt of displayOptions; trackBy: trackByOptionValue"
    class="flex items-center gap-2 text-sm text-slate-600"
  >
    <input
      type="radio"
      [name]="field.id"
      [value]="opt.value"
      [checked]="previewValue === opt.value"
      disabled
      tabindex="-1"
      aria-disabled="true"
    />
    {{ opt.label }}
  </div>
</div>

<div *ngIf="isCheckboxField" class="mt-1 space-y-2">
  <p *ngIf="loadingOptions" class="text-xs text-slate-400">Loading options...</p>
  <div
    *ngFor="let opt of displayOptions; trackBy: trackByOptionValue"
    class="flex items-center gap-2 text-sm text-slate-600"
  >
    <input
      type="checkbox"
      [checked]="isCheckboxChecked(opt.value)"
      disabled
      tabindex="-1"
      aria-disabled="true"
    />
    {{ opt.label }}
  </div>
</div>

<input
  *ngIf="fieldType === 'image'"
  type="file"
  accept="image/*"
  disabled
  tabindex="-1"
  aria-disabled="true"
  class="w-full border-b border-slate-300 bg-transparent py-2.5 text-sm text-slate-900 focus:outline-none disabled:cursor-default disabled:text-slate-500"
/>
