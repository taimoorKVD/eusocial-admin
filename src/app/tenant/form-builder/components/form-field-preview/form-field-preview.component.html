<label class="mb-1 block text-xs font-medium text-slate-500">
  {{ field.label }}
  <span *ngIf="field.required" class="text-red-500">*</span>
</label>

<input
  *ngIf="fieldType === 'text'"
  type="text"
  [placeholder]="field.placeholder"
  [(ngModel)]="field.value"
  tabindex="-1"
  class="w-full border-b border-slate-300 bg-transparent py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:border-slate-500 focus:outline-none"
/>

<input
  *ngIf="fieldType === 'email'"
  type="email"
  [placeholder]="field.placeholder"
  [(ngModel)]="field.value"
  tabindex="-1"
  class="w-full border-b border-slate-300 bg-transparent py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:border-slate-500 focus:outline-none"
/>

<input
  *ngIf="fieldType === 'number'"
  type="number"
  [placeholder]="field.placeholder"
  [(ngModel)]="field.value"
  tabindex="-1"
  class="w-full border-b border-slate-300 bg-transparent py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:border-slate-500 focus:outline-none"
/>

<textarea
  *ngIf="fieldType === 'textarea'"
  [placeholder]="field.placeholder"
  [(ngModel)]="field.value"
  rows="3"
  tabindex="-1"
  class="w-full resize-none border-b border-slate-300 bg-transparent py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:border-slate-500 focus:outline-none"
></textarea>

<select
  *ngIf="isSelectField"
  [ngModel]="field.value"
  (ngModelChange)="field.value = $event"
  tabindex="-1"
  class="w-full border-b border-slate-300 bg-transparent py-2.5 text-sm text-slate-900 focus:border-slate-500 focus:outline-none"
>
  <option *ngIf="loadingOptions" [ngValue]="null" disabled>Loading options...</option>
  <option *ngIf="optionsError && !loadingOptions" [ngValue]="null" disabled>
    Unable to load options
  </option>
  <option
    *ngIf="!loadingOptions && !optionsError && field.placeholder"
    [ngValue]="null"
    disabled
  >
    {{ field.placeholder }}
  </option>
  <option
    *ngFor="let opt of displayOptions; trackBy: trackByOptionValue"
    [ngValue]="opt.value"
  >
    {{ opt.label }}
  </option>
</select>

<div *ngIf="isRadioField" class="mt-1 space-y-2">
  <p *ngIf="loadingOptions" class="text-xs text-slate-400">Loading options...</p>
  <label
    *ngFor="let opt of displayOptions; trackBy: trackByOptionValue"
    class="flex items-center gap-2 text-sm text-slate-600"
  >
    <input
      type="radio"
      [name]="field.id"
      [value]="opt.value"
      [ngModel]="field.value"
      (ngModelChange)="field.value = $event"
      tabindex="-1"
    />
    {{ opt.label }}
  </label>
</div>

<div *ngIf="isCheckboxField" class="mt-1 space-y-2">
  <p *ngIf="loadingOptions" class="text-xs text-slate-400">Loading options...</p>
  <label
    *ngFor="let opt of displayOptions; trackBy: trackByOptionValue"
    class="flex items-center gap-2 text-sm text-slate-600"
  >
    <input
      type="checkbox"
      [checked]="isCheckboxChecked(opt.value)"
      tabindex="-1"
    />
    {{ opt.label }}
  </label>
</div>

<input
  *ngIf="fieldType === 'image'"
  type="file"
  accept="image/*"
  tabindex="-1"
  class="w-full border-b border-slate-300 bg-transparent py-2.5 text-sm text-slate-900 focus:border-slate-500 focus:outline-none"
/>
