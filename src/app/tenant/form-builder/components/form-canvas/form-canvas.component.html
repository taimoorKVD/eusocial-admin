<div
  cdkDropList
  #canvasList="cdkDropList"
  [id]="dropListId"
  class="form-canvas-drop-list"
  [class.grid]="!widthAwareLayout"
  [class.grid-cols-1]="!widthAwareLayout"
  [class.gap-4]="!widthAwareLayout"
  [class.md:grid-cols-2]="!widthAwareLayout"
  [class.md:gap-x-6]="!widthAwareLayout"
  [class.md:gap-y-4]="!widthAwareLayout"
  [class.form-canvas-drop-list--locked]="isDragDropDisabled"
  [class.form-canvas-drop-list--width-aware]="widthAwareLayout"
  [class.form-canvas-drop-list--width-aware-flow]="widthAwareLayout && widthAwareFlow"
  [cdkDropListData]="schema"
  [cdkDropListConnectedTo]="connectedDropLists"
  [cdkDropListDisabled]="isDragDropDisabled"
  [cdkDropListOrientation]="widthAwareLayout && !widthAwareFlow ? 'horizontal' : 'mixed'"
  (cdkDropListDropped)="onDrop($event)"
>
  <div
    *ngIf="schema.length === 0"
    class="form-canvas-empty"
    [class.col-span-1]="!widthAwareLayout"
    [class.md:col-span-2]="!widthAwareLayout"
  >
    <p class="text-sm font-medium text-slate-600">Drag fields here to build your form</p>
    <p class="mt-1 text-xs text-slate-400">Click a field to edit its settings</p>
  </div>

  <div
    *ngFor="let field of schema; trackBy: trackByFieldId"
    cdkDrag
    [cdkDragData]="field"
    [cdkDragDisabled]="isDragDropDisabled"
    [attr.data-field-id]="field.id"
    [attr.aria-hidden]="isFieldHidden(field)"
    class="form-canvas-field h-full"
    [class.form-canvas-field--hidden]="isFieldHidden(field)"
    [class.form-canvas-field--selected]="!selectionMode && field.id === selectedFieldId"
    [class.form-canvas-field--bulk-selected]="selectionMode && isFieldSelected(field)"
    [class.form-canvas-field--protected]="selectionMode && !isFieldDeletable(field)"
    [class.form-canvas-field--selection-mode]="selectionMode"
    [class.form-canvas-field--width-aware]="widthAwareLayout"
    [class.form-canvas-field--setup-flow]="widthAwareLayout && widthAwareFlow"
    [class.form-canvas-field--ft-build]="formTemplateBuildUi"
    [style.flex]="widthAwareLayout ? '0 0 auto' : null"
    [style.flex-basis]="widthAwareLayout ? fieldWidthFlexBasis(field) : null"
    [style.max-width]="widthAwareLayout ? fieldWidthFlexBasis(field) : null"
    [style.min-width]="widthAwareLayout ? '0' : null"
    (click)="onFieldClick(field)"
    (cdkDragStarted)="onFieldDragStarted()"
    (cdkDragEnded)="onFieldDragEnded()"
  >
    <div class="flex h-full items-start gap-3">
      @if (selectionMode) {
        <div
          class="form-canvas-field__select flex shrink-0 flex-col items-center gap-1 pt-1"
          (click)="onCheckboxClick($event)"
        >
          <input
            type="checkbox"
            class="form-canvas-field__checkbox h-4 w-4 rounded border-slate-300 text-[#FF9015] focus:ring-[#FF9015] disabled:cursor-not-allowed disabled:opacity-40"
            [checked]="isFieldSelected(field)"
            [disabled]="!isFieldDeletable(field)"
            [attr.aria-label]="
              isFieldDeletable(field)
                ? 'Select ' + field.label
                : field.label + ' (Protected)'
            "
            (change)="onCheckboxChange(field, $event)"
          />
          @if (!isFieldDeletable(field)) {
            <span class="max-w-[4.5rem] text-center text-[10px] font-medium leading-tight text-slate-400">
              Protected
            </span>
          }
        </div>
      }

      <div class="flex min-h-0 min-w-0 flex-1 flex-col overflow-hidden">
        <div class="min-h-0 min-w-0 flex-1 overflow-hidden">
          <app-form-field-preview
            [field]="field"
            [formTemplateBuildUi]="formTemplateBuildUi"
          ></app-form-field-preview>
        </div>

        @if (showFieldQuickActions && !selectionMode) {
          <div
            class="mt-3 flex shrink-0 flex-nowrap items-center gap-2 overflow-hidden"
            (click)="$event.stopPropagation()"
            (mousedown)="onQuickActionMouseDown($event)"
          >
            <button
              type="button"
              class="group inline-flex h-[35px] items-center justify-center overflow-hidden rounded-full transition-[background-color,padding,gap] duration-300 ease-[cubic-bezier(0.22,1,0.36,1)] focus:outline-none focus-visible:ring-2 focus-visible:ring-[#ff9015]/40 disabled:cursor-not-allowed disabled:opacity-40"
              [ngClass]="hasConditionalLogic(field)
                ? 'bg-[#161616] text-white hover:gap-1.5 hover:bg-black hover:pl-2.5 hover:pr-4'
                : 'w-[35px] bg-[#BDBDBD] text-white hover:bg-[#9CA3AF]'"
              [attr.aria-label]="hasConditionalLogic(field) ? 'Edit logic' : 'Conditional logic'"
              [title]="hasConditionalLogic(field) ? 'Edit logic' : 'Conditional logic'"
              [disabled]="interactionsDisabled"
              (click)="onQuickActionClick($event, field, 'condition')"
            >
              <span class="inline-flex h-[35px] w-[35px] shrink-0 items-center justify-center" aria-hidden="true">
                <app-logic-map-icon [size]="14"></app-logic-map-icon>
              </span>
              @if (hasConditionalLogic(field)) {
                <span
                  class="max-w-0 overflow-hidden whitespace-nowrap text-sm font-semibold leading-none opacity-0 transition-[max-width,opacity] duration-300 ease-[cubic-bezier(0.22,1,0.36,1)] group-hover:max-w-[5.5rem] group-hover:opacity-100"
                >Edit logic</span>
              }
            </button>
            <button
              type="button"
              class="group inline-flex h-[35px] items-center justify-center overflow-hidden rounded-full transition-[background-color,padding,gap] duration-300 ease-[cubic-bezier(0.22,1,0.36,1)] focus:outline-none focus-visible:ring-2 focus-visible:ring-[#ff9015]/40 disabled:cursor-not-allowed disabled:opacity-40"
              [ngClass]="hasAutomationRules(field)
                ? 'bg-[#D0DD28] text-[#161616] hover:gap-1.5 hover:bg-[#c5d700] hover:pl-2.5 hover:pr-4'
                : 'w-[35px] bg-[#BDBDBD] text-white hover:bg-[#9CA3AF]'"
              [attr.aria-label]="hasAutomationRules(field) ? 'Edit automation' : 'Automation Rules'"
              [title]="hasAutomationRules(field) ? 'Edit automation' : 'Automation Rules'"
              [disabled]="interactionsDisabled"
              (click)="onQuickActionClick($event, field, 'automation')"
            >
              <span class="inline-flex h-[35px] w-[35px] shrink-0 items-center justify-center" aria-hidden="true">
                <app-automation-rule-icon></app-automation-rule-icon>
              </span>
              @if (hasAutomationRules(field)) {
                <span
                  class="max-w-0 overflow-hidden whitespace-nowrap text-sm font-semibold leading-none opacity-0 transition-[max-width,opacity] duration-300 ease-[cubic-bezier(0.22,1,0.36,1)] group-hover:max-w-[8rem] group-hover:opacity-100"
                >Edit automation</span>
              }
            </button>
          </div>
        }
      </div>
    </div>
  </div>
</div>
