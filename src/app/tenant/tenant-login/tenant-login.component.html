<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">

    <!-- Logo -->
    <div class="flex justify-center mb-6">
      <img src="assets/eusocial-logo.png" alt="Eusocial Logo" class="h-16 object-contain" />
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">

      <!-- Email Field -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
          Email <span class="text-red-500">*</span>
        </label>

        <input id="email" type="email" formControlName="email" placeholder="Enter your email"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" />

        <div class="mt-1 text-sm text-red-500" *ngIf="submitted && f['email']?.errors">
          <small *ngIf="f['email']?.errors?.['required']">Email is required.</small>
          <small *ngIf="f['email']?.errors?.['email']">Enter a valid email.</small>
        </div>
      </div>

      <!-- Password Field -->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
          Password <span class="text-red-500">*</span>
        </label>

        <input id="password" type="password" formControlName="password" placeholder="Enter your password"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" />

        <div class="mt-1 text-sm text-red-500" *ngIf="submitted && f['password']?.errors">
          <small *ngIf="f['password']?.errors?.['required']">Password is required.</small>
          <small *ngIf="f['password']?.errors?.['minlength']">Minimum 6 characters.</small>
        </div>
      </div>

      <!-- Forgot Password -->
      <div class="text-right">
        <a routerLink="/forgot-password" class="text-sm text-blue-600 hover:underline">
          Forgot your password?
        </a>
      </div>

      <div *ngIf="errorMessage" class="text-red-500 text-sm text-center">
        {{ errorMessage }}
      </div>

      <!-- Submit Button -->
      <button type="submit" [disabled]="loading" class="btn-login flex items-center justify-center gap-2">

        <!-- Spinner -->
        <svg *ngIf="loading" class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
          viewBox="0 0 24 24">

          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
          </circle>

          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z">
          </path>
        </svg>

        <!-- Text -->
        <span>
          {{ loading ? 'Logging in...' : 'Login' }}
        </span>

      </button>

    </form>
  </div>
</div>
