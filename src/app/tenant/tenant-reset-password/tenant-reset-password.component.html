<div class="min-h-screen flex items-center justify-center bg-gray-100 my-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
    <div class="flex justify-center mb-8">
      <img src="assets/eusocial-logo.png" alt="Eusocial Logo" class="h-16 object-contain" />
    </div>

    <h1 class="text-2xl font-bold text-center mb-8">Reset Password</h1>

    <div *ngIf="verifying" class="text-sm text-gray-500 text-center mb-4">Verifying reset link...</div>
    <div *ngIf="!verifying && !tokenValid" class="text-sm text-red-500 text-center mb-4">
      Reset link is invalid or expired.
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4" *ngIf="tokenValid && !verifying">
      <!-- Email Display -->
      <div class="email-display">
        <span class="label-text">Email <span class="text-orange-600">*</span></span>
        <span class="email-value">{{ form.get('email')?.value }}</span>
        <input formControlName="email" type="email" hidden />
      </div>

      <!-- New Password -->
      <div class="form-group">
        <label for="password" class="label-text">
          New Password <span class="text-orange-600">*</span>
        </label>
        <input id="password" type="password" formControlName="password" placeholder="Enter new password"
          class="form-control" />
        <div class="error-message" *ngIf="submitted && f['password']?.errors">
          <small *ngIf="f['password']?.errors?.['required']">Password is required.</small>
          <small *ngIf="f['password']?.errors?.['minlength']">Minimum 6 characters.</small>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <label for="password_confirm" class="label-text">
          Confirm Password <span class="text-orange-600">*</span>
        </label>
        <input id="password_confirm" type="password" formControlName="password_confirm" placeholder="Confirm new password"
          class="form-control" />
        <div class="error-message" *ngIf="submitted && f['password_confirm']?.errors">
          <small *ngIf="f['password_confirm']?.errors?.['required']">Confirm Password is required.</small>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" [disabled]="loading" class="btn-login mt-6">
        {{ loading ? 'Resetting...' : 'Reset Password' }}
      </button>

      <!-- Back to Login -->
      <div class="text-center mt-6">
        <a routerLink="/tenant/login" class="back-link">Back to Login</a>
      </div>
    </form>
  </div>
</div>
