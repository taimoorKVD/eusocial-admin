<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
    <div class="flex justify-center mb-6">
      <img src="assets/eusocial-logo.png" alt="Eusocial Logo" class="h-16 object-contain" />
    </div>

    <h3 class="text-xl font-semibold text-center mb-2">Reset Password</h3>

    <div *ngIf="verifying" class="text-sm text-gray-500 text-center mb-4">Verifying reset link...</div>
    <div *ngIf="!verifying && !tokenValid" class="text-sm text-red-500 text-center mb-4">
      Reset link is invalid or expired.
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5" *ngIf="tokenValid && !verifying">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
          Email <span class="text-red-500">*</span>
        </label>
        <input id="email" type="email" formControlName="email"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-100" readonly />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
          New Password <span class="text-red-500">*</span>
        </label>
        <input id="password" type="password" formControlName="password" placeholder="Enter new password"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
        <div class="mt-1 text-sm text-red-500" *ngIf="submitted && f['password']?.errors">
          <small *ngIf="f['password']?.errors?.['required']">Password is required.</small>
          <small *ngIf="f['password']?.errors?.['minlength']">Minimum 6 characters.</small>
        </div>
      </div>

      <div>
        <label for="password_confirm" class="block text-sm font-medium text-gray-700 mb-1">
          Confirm Password <span class="text-red-500">*</span>
        </label>
        <input id="password_confirm" type="password" formControlName="password_confirm" placeholder="Confirm new password"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
      </div>

      <button type="submit" [disabled]="loading" class="btn-login">
        {{ loading ? 'Resetting...' : 'Reset password' }}
      </button>

      <p class="text-center text-sm">
        <a routerLink="/tenant/login" class="text-blue-600 hover:underline">Back to Login</a>
      </p>
    </form>
  </div>
</div>
