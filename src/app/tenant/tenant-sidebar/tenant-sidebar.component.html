<div class="w-64 h-screen bg-white flex flex-col" style="border-right: 1px solid #6c71727a;">

  <!-- Logo -->
  <div class="p-4 font-bold text-xl border-b">
    <img src="assets/eusocial-logo.png" alt="Eusocial Logo" class="w-[160px]" />
  </div>

  <!-- Menu -->
  <div class="overflow-y-auto px-4 py-2 space-y-1">

    <!-- HOME -->
    <a routerLink="/tenant/home"
       routerLinkActive="bg-blue-50 text-blue-600 border-l-4 border-blue-500"
       class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-100">

      <!-- SVG -->
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>

      Home
    </a>

    <!-- USER DASHBOARD -->
    <a routerLink="/tenant/user-dashboard"
       routerLinkActive="bg-blue-50 text-blue-600 border-l-4 border-blue-500"
       class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-100">

      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-4.4 0-8 2.2-8 5v3h16v-3c0-2.8-3.6-5-8-5z"/>
      </svg>

      User Dashboard
    </a>

    <!-- SETUP MENU -->
    <div>

      <button (click)="toggleSetup()"
              class="w-full flex items-center justify-between px-3 py-2 rounded-lg hover:bg-gray-100">

        <div class="flex items-center gap-3">

          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M19.14 12.94a7.48 7.48 0 0 0 .05-.94 7.48 7.48 0 0 0-.05-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.28 7.28 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.88 2h-3.76a.5.5 0 0 0-.49.42l-.36 2.54c-.57.23-1.12.53-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.73 8.48a.5.5 0 0 0 .12.64l2.03 1.58c-.03.31-.05.62-.05.94s.02.63.05.94L2.85 14.16a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.43.34.6.22l2.39-.96c.51.41 1.06.77 1.63.94l.36 2.54c.05.24.25.42.49.42h3.76c.24 0 .44-.18.49-.42l.36-2.54c.57-.23 1.12-.53 1.63-.94l2.39.96c.17.07.46-.02.6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58z"/>
          </svg>

          Setup
        </div>

        <span>{{ openSetup ? '▲' : '▼' }}</span>

      </button>

      <!-- SUB MENU -->
      <div *ngIf="openSetup" class="ml-8 mt-1 space-y-1">

        <a routerLink="/setup/users"
           routerLinkActive="text-blue-600 font-medium"
           class="block px-3 py-2 rounded-lg hover:bg-gray-100 text-sm">
          Users
        </a>

        <a routerLink="/setup/jobs"
           routerLinkActive="text-blue-600 font-medium"
           class="block px-3 py-2 rounded-lg hover:bg-gray-100 text-sm">
          Job Positions
        </a>

        <a routerLink="/setup/items"
           routerLinkActive="text-blue-600 font-medium"
           class="block px-3 py-2 rounded-lg hover:bg-gray-100 text-sm">
          Items
        </a>

        <a routerLink="/setup/vendors"
           routerLinkActive="text-blue-600 font-medium"
           class="block px-3 py-2 rounded-lg hover:bg-gray-100 text-sm">
          Vendors
        </a>

      </div>
    </div>

  </div>
</div>
