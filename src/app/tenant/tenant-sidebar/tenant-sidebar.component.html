<div
  class="tenant-sidebar fixed md:static top-0 left-0 h-full w-64 transform transition-transform duration-300 z-50"
  [ngClass]="{
    '-translate-x-full': !isOpen,
    'translate-x-0': isOpen,
    'md:translate-x-0': true
  }">

  <!-- Close button mobile -->
  <div class="flex justify-end md:hidden absolute top-[30px] right-[10px]">
    <button
      class="tenant-sidebar__close-mobile text-2xl"
      (click)="closeSidebar.emit()">
      ✕
    </button>
  </div>

<div class="w-64 h-screen flex flex-col">

  <!-- Logo -->
  <div class="tenant-sidebar__logo">
    <img src="assets/eusocial-logo-02.png" alt="Eusocial Logo" class="w-[160px]" />
  </div>

  <!-- Menu -->
  <div class="tenant-sidebar__menu overflow-y-auto flex-1">

    <!-- HOME -->
    <a [routerLink]="['/tenant',  session.getSlug(), 'home']" routerLinkActive="tenant-sidebar__link--active"
      class="tenant-sidebar__link font-ibm">

      <!-- <svg style="opacity: 0" width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6.83333 1V12.6667M1 6.83333L6.83333 12.6667L12.6667 6.83333" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg> -->

      <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 10.5 12 3l9 7.5" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M5.25 9.75V21h13.5V9.75" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 21v-6h4.5v6" />
      </svg>

      Home
    </a>

    <!-- USER DASHBOARD -->
    <a [routerLink]="['/tenant',  session.getSlug(), 'user-dashboard']"
      routerLinkActive="tenant-sidebar__link--active"
      class="tenant-sidebar__link font-ibm">

       <!-- <svg style="opacity: 0" width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6.83333 1V12.6667M1 6.83333L6.83333 12.6667L12.6667 6.83333" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg> -->

      <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 20h16" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M7 16V9" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 16V5" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16v-3" />
      </svg>

      User Dashboard
    </a>

    <!-- SETUP MENU -->

        </span>
        <span *ngIf="openSetup">

            <path stroke-linecap="round" stroke-linejoin="round" d="M16 19v-7" />
