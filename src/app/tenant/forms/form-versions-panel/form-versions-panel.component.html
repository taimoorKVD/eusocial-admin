<div class="mb-4 rounded-lg border border-slate-200 bg-white">

  <!-- Panel header -->
  <button
    type="button"
    (click)="togglePanel()"
    class="flex w-full items-center justify-between rounded-lg px-4 py-3 text-left transition hover:bg-slate-50 focus:outline-none"
  >
    <div class="flex items-center gap-2">
      <svg class="h-4 w-4 shrink-0 text-slate-500" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1.8" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M12 6v6l4 2M12 2a10 10 0 1 0 0 20A10 10 0 0 0 12 2Z" />
      </svg>
      <span class="text-sm font-semibold text-slate-700">Versions</span>
      <span
        *ngIf="items.length"
        class="rounded-full bg-slate-100 px-2 py-0.5 text-[11px] font-medium text-slate-500"
      >{{ items.length }}</span>
    </div>
    <svg
      class="h-4 w-4 shrink-0 text-slate-400 transition-transform"
      [class.rotate-180]="panelOpen"
      viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6" />
    </svg>
  </button>

  <!-- Panel body -->
  <div *ngIf="panelOpen" class="border-t border-slate-100 px-4 pb-4 pt-3">

    <p *ngIf="loading" class="text-xs text-slate-400">Loading versions…</p>
    <p *ngIf="error" class="text-xs text-red-500">{{ error }}</p>

    <div *ngIf="!loading && !error && items.length === 0" class="text-xs text-slate-400">
      No versions saved yet.
    </div>

    <!-- Version list -->
    <div *ngIf="items.length" class="space-y-2">
      <div
        *ngFor="let item of items; trackBy: trackById"
        class="rounded-md border border-slate-100"
      >
        <!-- Version row header -->
        <div class="px-3 py-2">

          <div>
          <!-- Expand toggle -->
          <button
            type="button"
            (click)="toggleItem(item)"
            class="flex flex-1 items-center gap-2 text-left text-sm font-medium text-slate-700 hover:text-[#0054AC] focus:outline-none"
          >
            <svg
              class="h-3.5 w-3.5 shrink-0 text-slate-400 transition-transform"
              [class.rotate-90]="item.expanded"
              viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            >
              <path stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6" />
            </svg>
            {{ versionLabel(item.version) }}
            <span *ngIf="item.version.createdAt" class="text-[11px] font-normal text-slate-400">
              &mdash; {{ item.version.createdAt | date:'MMM d, y, h:mm a' }}
            </span>
          </button>
          </div>

          <div class="flex items-center gap-2 mt-2">
          <!-- Preview button -->
          <button
            type="button"
            (click)="openPreview(item)"
            [disabled]="item.previewing"
            class="shrink-0 rounded-md border border-slate-300 px-2.5 py-1 text-xs font-medium text-slate-600 transition hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-50"
          >
            {{ item.previewing ? 'Loading…' : 'Preview' }}
          </button>

          <!-- Restore button -->
          <button
            type="button"
            (click)="restoreVersion(item)"
            [disabled]="item.restoring"
            class="shrink-0 rounded-md border border-[#0054AC] px-2.5 py-1 text-xs font-medium text-[#0054AC] transition hover:bg-[#0054AC] hover:text-white disabled:cursor-not-allowed disabled:opacity-50"
          >
            {{ item.restoring ? 'Restoring…' : 'Restore' }}
          </button>
        </div>
        </div>

        <!-- Expanded detail — field list -->
        <div *ngIf="item.expanded" class="border-t border-slate-100 bg-slate-50 px-3 py-2">
          <p *ngIf="item.loading" class="text-xs text-slate-400">Loading fields…</p>

          <ng-container *ngIf="!item.loading && item.detail">
            <p *ngIf="item.detail.fields.length === 0" class="text-xs text-slate-400">
              No fields in this version.
            </p>
            <ul *ngIf="item.detail.fields.length" class="space-y-1">
              <li
                *ngFor="let field of item.detail.fields; trackBy: trackByField"
                class="flex items-center gap-2 rounded px-2 py-1 text-xs text-slate-600 hover:bg-slate-100"
              >
                <svg class="h-3 w-3 shrink-0 text-slate-400" viewBox="0 0 24 24"
                  fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="18" height="18" rx="2" />
                  <path stroke-linecap="round" d="M7 8h10M7 12h7" />
                </svg>
                <span class="font-medium">{{ field.label }}</span>
                <span class="text-slate-400">{{ field.fieldTypeName || field.type }}</span>
                <span *ngIf="field.required" class="text-red-400">required</span>
              </li>
            </ul>
          </ng-container>
        </div>
      </div>
    </div>

    <button
      *ngIf="!loading && (error || items.length)"
      type="button"
      (click)="reload()"
      class="mt-3 text-xs text-slate-400 underline hover:text-slate-600"
    >
      Refresh
    </button>
  </div>
</div>

<!-- ===== PREVIEW MODAL ===== -->
<div
  *ngIf="previewModalOpen"
  class="fixed inset-0 z-[60] flex items-center justify-center bg-black/40 p-4"
  (click)="closePreview()"
>
  <div
    class="relative w-full max-w-lg max-h-[85vh] overflow-y-auto rounded-xl bg-white shadow-2xl"
    (click)="$event.stopPropagation()"
  >
    <!-- Modal header -->
    <div class="flex items-center justify-between border-b border-slate-100 px-5 py-4">
      <div>
        <h2 class="text-sm font-semibold text-slate-900">{{ previewLabel }}</h2>
        <p class="text-xs text-slate-400">Read-only field preview</p>
      </div>
      <button
        type="button"
        (click)="closePreview()"
        class="rounded-lg p-1.5 text-slate-400 hover:bg-slate-100 hover:text-slate-600 focus:outline-none"
        aria-label="Close"
      >
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Modal body -->
    <div class="px-5 py-4">
      <p *ngIf="previewLoading" class="text-xs text-slate-400">Loading preview…</p>

      <p *ngIf="!previewLoading && previewFields.length === 0" class="text-xs text-slate-400">
        No fields in this version.
      </p>

      <div
        *ngIf="!previewLoading && previewFields.length"
        class="grid grid-cols-1 gap-4 sm:grid-cols-2"
      >
        <div
          *ngFor="let field of previewFields; trackBy: trackByField"
          class="rounded-md border border-slate-100 bg-slate-50 px-3 py-3"
          [class.sm:col-span-2]="field.type === 'textarea' || field.type === 'image'"
        >
          <app-form-field-preview [field]="field"></app-form-field-preview>
        </div>
      </div>
    </div>

    <!-- Modal footer -->
    <div class="border-t border-slate-100 px-5 py-3 flex justify-end">
      <button
        type="button"
        (click)="closePreview()"
        class="rounded-md border border-slate-200 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50"
      >
        Close
      </button>
    </div>
  </div>
</div>
