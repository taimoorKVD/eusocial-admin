@if (isOpen) {
  <div
    class="form-preview-backdrop"
    role="dialog"
    aria-modal="true"
    aria-labelledby="form-preview-title"
    (click)="onBackdropClick($event)"
  >
    <div class="form-preview-panel">
      <div class="form-preview-header">
        <h2 id="form-preview-title" class="form-preview-title font-ibm">
          Form Preview
        </h2>
        <button
          type="button"
          class="form-preview-close"
          aria-label="Close preview"
          (click)="close()"
        >
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="form-preview-body">
        @if (loading()) {
          <div class="form-preview-loader">
            <app-eu-loader></app-eu-loader>
          </div>
        } @else if (previewFields().length === 0) {
          <p class="form-preview-empty font-ibm">
            No visible fields to preview. Add fields to the canvas to see how the form will look.
          </p>
        } @else {
          <app-dynamic-form [fields]="previewFields()"></app-dynamic-form>
        }
      </div>

      <div class="form-preview-footer">
        <button
          type="button"
          class="form-preview-close-btn font-ibm"
          (click)="close()"
        >
          Close
        </button>
      </div>
    </div>
  </div>
}
