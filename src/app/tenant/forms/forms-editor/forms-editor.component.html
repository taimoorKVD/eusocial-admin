<app-confirm-modal
  [isOpen]="showExitConfirmModal"
  title="Are you sure you want to exit?"
  message=""
  confirmText="Confirm"
  cancelText="Cancel"
  (confirmed)="onConfirmExit()"
  (closed)="onCancelExit()"
></app-confirm-modal>

<app-form-preview-modal
  [isOpen]="showPreviewModal"
  [formFields]="builderSchema"
  (closed)="closePreviewModal()"
></app-form-preview-modal>

<app-form-builder-workspace
  [moduleName]="moduleName"
  [schema]="builderSchema"
  [selectedFieldId]="selectedFieldId"
  [activeTab]="activeTab"
  [showPreviewAction]="moduleName === 'users'"
  [paletteListId]="paletteListId"
  [canvasListId]="canvasListId"
  (selectField)="onSelectField($event)"
  (duplicateField)="onDuplicateField($event)"
  (deleteField)="onDeleteField($event)"
  (updateField)="updateField($event)"
  (activeTabChange)="onActiveTabChange($event)"
  (save)="saveForm()"
  (preview)="openPreviewModal()"
  (restoreVersion)="onRestoreVersion($event)"
  (versionsLoadingChange)="onVersionsLoadingChange($event)"
  (dynamicOptionsLoadingChange)="onDynamicOptionsLoading($event)"
>
  @if (moduleName === 'users') {
    <app-form-canvas
      formBuilderCanvas
      [dropListId]="canvasListId"
      [schema]="builderSchema"
      [selectedFieldId]="selectedFieldId"
      [connectedDropLists]="[paletteListId]"
      (dropped)="onCanvasDrop($event)"
      (selectField)="onSelectField($event)"
    ></app-form-canvas>
  }

  @if (moduleName === 'vendors') {
    <app-form-canvas
      formBuilderCanvas
      [dropListId]="canvasListId"
      [schema]="builderSchema"
      [selectedFieldId]="selectedFieldId"
      [connectedDropLists]="[paletteListId]"
      (dropped)="onCanvasDrop($event)"
      (selectField)="onSelectField($event)"
    ></app-form-canvas>
  }

  @if (moduleName === 'job-position') {
    <app-setup-job-position formBuilderCanvas></app-setup-job-position>
  }
</app-form-builder-workspace>
