<ng-container *ngIf="isLoading">
  <app-eu-loader></app-eu-loader>
</ng-container>

<div class="grid grid-cols-5 gap-4 p-6 font-ibm">

  <!-- CANVAS -->
  <div class="col-span-5 lg:col-span-3">
    <div class="mb-4 grid grid-cols-2 gap-2 rounded-lg border border-slate-200 bg-slate-50 p-3">
      <div>
        <input type="text" [(ngModel)]="formName" disabled  placeholder="Form name"
          class="font-ibm px-3 py-2 text-[16px] font-medium focus:outline-none" />
      </div>

      <div class="flex justify-end">
        <!-- <button
          type="button"
          class="rounded-md border border-slate-300 px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100"
          (click)="previewPayload()"
        >
          Preview Payload
        </button> -->

        <button type="button"
          class="rounded-md bg-[#0054AC] px-3 py-2 text-sm font-medium text-white hover:bg-[#00448c]"
          (click)="saveForm()">
          Save Form
        </button>
      </div>
    </div>

    <ng-container *ngIf="moduleName === 'users'">
      <app-form-canvas [schema]="builderSchema" [selectedFieldId]="selectedFieldId"
        [connectedDropLists]="[paletteListId]" (dropped)="onCanvasDrop($event)"
        (selectField)="onSelectField($event)"></app-form-canvas>
    </ng-container>

    <ng-container *ngIf="moduleName === 'vendors'">
      <app-setup-vendors></app-setup-vendors>
    </ng-container>

    <ng-container *ngIf="moduleName === 'job-position'">
      <app-setup-job-position></app-setup-job-position>
    </ng-container>
  </div>

  <!-- PALETTE + SETTINGS -->
  <div class="col-span-5 overflow-hidden rounded-lg border border-gray-200 bg-white shadow-sm lg:col-span-2">
    <div class="border-b border-gray-200 bg-gray-50 px-4 py-3">
      <nav class="flex items-center gap-2">
        <button type="button" class="rounded-md px-3 py-2 text-sm font-medium transition focus:outline-none"
          [ngClass]="activeTab === 'fields' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:bg-slate-100'"
          (click)="setActiveTab('fields')">
          Fields
        </button>
        <button type="button" class="rounded-md px-3 py-2 text-sm font-medium transition focus:outline-none"
          [ngClass]="activeTab === 'settings' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:bg-slate-100'"
          (click)="setActiveTab('settings')">
          Field Settings
        </button>
        <button type="button" class="rounded-md px-3 py-2 text-sm font-medium transition focus:outline-none"
          [ngClass]="activeTab === 'versions' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:bg-slate-100'"
          (click)="setActiveTab('versions')">
          Versions
        </button>
      </nav>
    </div>

    <div class="p-4">
      <div [class.hidden]="activeTab !== 'fields'">
        <app-builder [connectedDropLists]="[canvasListId]"></app-builder>
      </div>

      <div *ngIf="activeTab === 'versions'">
        <app-form-versions-panel
          [moduleName]="moduleName"
          (restore)="onRestoreVersion($event)"
          (loadingChange)="onVersionsLoadingChange($event)"
        ></app-form-versions-panel>
      </div>

      <div [class.hidden]="activeTab !== 'settings'" class="space-y-4">
        <div
          *ngIf="hiddenFields.length"
          class="rounded-md border border-amber-100 bg-amber-50 px-3 py-2.5"
        >
          <p class="text-xs font-medium text-amber-800">Hidden fields</p>
          <p class="mt-0.5 text-[11px] text-amber-700">
            These fields stay in the form schema but are hidden on the canvas.
          </p>
          <div class="mt-2 flex flex-wrap gap-2">
            <button
              *ngFor="let field of hiddenFields; trackBy: trackByFieldId"
              type="button"
              class="rounded-md border border-amber-200 bg-white px-2.5 py-1 text-xs font-medium text-amber-900 hover:bg-amber-100"
              (click)="onSelectField(field)"
            >
              {{ field.label }}
            </button>
          </div>
        </div>

        <ng-container *ngIf="selectedField; else noSelection">
          <app-field-settings
            [field]="selectedField"
            [activeModuleName]="moduleName"
            (update)="updateField($event)"
            (duplicate)="onDuplicateField(selectedField)"
            (delete)="onDeleteField(selectedField)"
            (loadingChange)="onDynamicOptionsLoading($event)"
          ></app-field-settings>
        </ng-container>
        <ng-template #noSelection>
          <div class="rounded-lg border border-dashed border-slate-300 bg-slate-50 p-4 text-sm text-slate-600">
            Click a field on the canvas to edit its settings.
            <span *ngIf="hiddenFields.length"> Or pick a hidden field above to re-enable it.</span>
          </div>
        </ng-template>
      </div>
    </div>
  </div>
</div>
