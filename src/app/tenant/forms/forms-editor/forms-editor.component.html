<div class="grid grid-cols-5 gap-4 pr-4 pt-4">

  <!-- MAIN CONTENT -->
  <div class="col-span-5 lg:col-span-3">
    <div class="mb-4 flex items-center justify-between gap-2 rounded-lg border border-slate-200 bg-slate-50 p-3">
      <input
        type="text"
        [(ngModel)]="formName"
        placeholder="Form name"
        class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm focus:border-slate-400 focus:outline-none"
      />

      <div class="flex items-center gap-2">
        <button
          type="button"
          class="rounded-md border border-slate-300 px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100"
          (click)="previewPayload()">
          Preview Payload
        </button>

        <button
          type="button"
          class="rounded-md bg-[#0054AC] px-3 py-2 text-sm font-medium text-white hover:bg-[#00448c]"
          (click)="saveForm()">
          Save Form
        </button>
      </div>
    </div>

    <ng-container *ngIf="moduleName === 'users'">
      <app-setup-user
        [schema]="builderSchema"
        [connectedDropLists]="canvasConnectedLists"
        (selectField)="onSelectField($event)"
        (canvasDrop)="onCanvasDrop($event)"
        (duplicateField)="onDuplicateField($event)"
        (deleteField)="onDeleteField($event)">
      </app-setup-user>
    </ng-container>

    <ng-container *ngIf="moduleName === 'vendors'">
      <app-setup-vendors></app-setup-vendors>
    </ng-container>

    <ng-container *ngIf="moduleName === 'job-position'">
      <app-setup-job-position></app-setup-job-position>
    </ng-container>
  </div>

  <!-- SIDE PANEL -->
  <div class="col-span-5 lg:col-span-2 border border-gray-200 rounded-lg shadow-sm overflow-hidden">
    <div class="border-b border-gray-200 bg-gray-50 px-4 py-3">
      <nav class="flex items-center gap-2">
        <button type="button"
          class="rounded-md px-3 py-2 text-sm font-medium transition focus:outline-none"
          [ngClass]="activeTab === 'fields' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:bg-slate-100'"
          (click)="setActiveTab('fields')">
          Fields
        </button>
        <button type="button"
          class="rounded-md px-3 py-2 text-sm font-medium transition focus:outline-none"
          [ngClass]="activeTab === 'settings' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:bg-slate-100'"
          (click)="setActiveTab('settings')">
          Field Settings
        </button>
      </nav>
    </div>

    <div class="p-4">
      <div [class.hidden]="activeTab !== 'fields'">
        <app-builder
          [connectedDropLists]="sidebarConnectedLists"
          (schemaChange)="onSchemaChange($event)">
        </app-builder>
      </div>

      <div [class.hidden]="activeTab !== 'settings'" class="space-y-4">
        <ng-container *ngIf="selectedField; else noSelection">
          <app-field-settings [field]="selectedField" (update)="updateField($event)">
          </app-field-settings>
        </ng-container>
        <ng-template #noSelection>
          <div class="rounded-lg border border-dashed border-slate-300 bg-slate-50 p-4 text-sm text-slate-600">
            Select a field to edit settings.
          </div>
        </ng-template>
      </div>
    </div>
  </div>
</div>
