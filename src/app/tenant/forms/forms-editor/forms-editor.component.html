<div class="grid grid-cols-5 gap-4 pr-4 pt-4">

  <!-- MAIN CONTENT -->
  <div class="col-span-5 lg:col-span-3">
    <ng-container *ngIf="moduleName === 'users'">
      <div cdkDropList id="userFormDropZone" [cdkDropListData]="builderSchema"
        (cdkDropListDropped)="onUserDrop($event)" class="min-h-[calc(100vh-3rem)]">

        <app-setup-user [schema]="builderSchema" (selectField)="onSelectField($event)">
        </app-setup-user>

      </div>
    </ng-container>

    <ng-container *ngIf="moduleName === 'vendors'">
      <app-setup-vendors></app-setup-vendors>
    </ng-container>

    <ng-container *ngIf="moduleName === 'job-position'">
      <app-setup-job-position></app-setup-job-position>
    </ng-container>
  </div>

  <!-- SIDE PANEL -->
  <div class="col-span-5 lg:col-span-2 border border-gray-200 rounded-lg shadow-sm overflow-hidden">
    <div class="border-b border-gray-200 bg-gray-50 px-4 py-3">
      <nav class="flex items-center gap-2">
        <button type="button"
          class="rounded-md px-3 py-2 text-sm font-medium transition focus:outline-none"
          [ngClass]="activeTab === 'fields' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:bg-slate-100'"
          (click)="setActiveTab('fields')">
          Fields
        </button>
        <button type="button"
          class="rounded-md px-3 py-2 text-sm font-medium transition focus:outline-none"
          [ngClass]="activeTab === 'settings' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:bg-slate-100'"
          (click)="setActiveTab('settings')">
          Field Settings
        </button>
      </nav>
    </div>

    <div class="p-4">
      <div *ngIf="activeTab === 'fields'">
        <app-builder (schemaChange)="onSchemaChange($event)"></app-builder>
      </div>

      <div *ngIf="activeTab === 'settings'" class="space-y-4">
        <ng-container *ngIf="selectedField; else noSelection">
          <app-field-settings [field]="selectedField" (update)="updateField($event)">
          </app-field-settings>
        </ng-container>
        <ng-template #noSelection>
          <div class="rounded-lg border border-dashed border-slate-300 bg-slate-50 p-4 text-sm text-slate-600">
            Select a field to edit settings.
          </div>
        </ng-template>
      </div>
    </div>
  </div>
</div>
