<div class="flex h-screen bg-gray-100">

  <!-- Sidebar -->
  <app-tenant-sidebar
    [isOpen]="sidebarOpen"
    (closeSidebar)="sidebarOpen = false"
  ></app-tenant-sidebar>

  <!-- Main Area -->
  <div class="flex flex-col flex-1">

    <!-- Topbar -->
    <app-tenant-topbar
      (toggleSidebar)="toggleSidebar()"
    ></app-tenant-topbar>

    <!-- Page Content -->
    <main class="flex-1 p-4 overflow-y-auto bg-[#f5f5f5]">
      <router-outlet></router-outlet>
    </main>

  </div>
</div>
