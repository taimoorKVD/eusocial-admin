<div class="p-6 bg-white min-h-screen">

  <!-- Header -->
  <h2 class="text-blue-600 text-sm font-medium mb-6">
    Create/View Users
  </h2>

  <!-- Select User -->
  <div class="mb-8 w-64">
    <label class="text-sm text-gray-600">Select User</label>
    <div class="border-b flex justify-between items-center py-2 cursor-pointer">
      <span class="text-gray-400 text-sm">Select User</span>
      <span>⌄</span>
    </div>
  </div>

  <!-- Contact Info -->
  <h3 class="text-sm text-gray-500 mb-4">Contact Info</h3>

  <!-- Form Grid -->
  <div class="grid grid-cols-2 gap-10 max-w-4xl">

    <!-- Full Name -->
    <div>
      <input type="text" placeholder="Placeholder text"
        class="w-full border-b focus:outline-none py-2 text-sm" />
      <label class="text-xs text-gray-500">Full Name</label>
    </div>

    <!-- Phone -->
    <div>
      <input type="text" placeholder="Placeholder text"
        class="w-full border-b focus:outline-none py-2 text-sm" />
      <label class="text-xs text-gray-500">Phone Number</label>
    </div>

    <!-- Address -->
    <div>
      <input type="text" placeholder="*Placeholder text"
        class="w-full border-b focus:outline-none py-2 text-sm" />
      <label class="text-xs text-gray-500">Address</label>
    </div>

    <!-- Email -->
    <div>
      <input type="email" placeholder="*Placeholder text"
        class="w-full border-b focus:outline-none py-2 text-sm" />
      <label class="text-xs text-gray-500">Email</label>
    </div>

    <!-- Username -->
    <div>
      <input type="text" placeholder="Placeholder text"
        class="w-full border-b focus:outline-none py-2 text-sm" />
      <label class="text-xs text-gray-500">Username</label>
    </div>

    <!-- Password -->
    <div>
      <input type="password" value="password123"
        class="w-full border-b focus:outline-none py-2 text-sm" />
      <label class="text-xs text-gray-500">Password</label>
    </div>

    <!-- Job Position Dropdown -->
    <div>
      <label class="text-xs text-gray-500">Job Position</label>

      <select
        [(ngModel)]="selectedJob"
        class="w-full border-b py-2 text-sm bg-transparent focus:outline-none"
      >
        <option *ngFor="let job of jobPositions" [ngValue]="job">
          {{ job.label }}
        </option>
      </select>
    </div>

    <!-- Location Dropdown -->
    <div>
      <label class="text-xs text-gray-500">Location</label>

      <select
        [(ngModel)]="selectedLocation"
        class="w-full border-b py-2 text-sm bg-transparent focus:outline-none"
      >
        <option *ngFor="let loc of locations" [ngValue]="loc">
          {{ loc.label }}
        </option>
      </select>
    </div>

  </div>

  <!-- Availability -->
  <div class="mt-10">
    <label class="text-sm text-gray-600">Availability</label>

    <div class="flex gap-2 mt-3 flex-wrap">
      <button
        *ngFor="let day of availabilityDays"
        (click)="selectDay(day)"
        class="px-3 py-1 text-xs border rounded"
        [class.bg-blue-100]="selectedDay === day"
        [class.border-blue-500]="selectedDay === day"
      >
        {{ day }}
      </button>
    </div>
  </div>

  <!-- Footer Buttons -->
  <div class="flex justify-end gap-3 mt-16">

    <button class="px-6 py-2 border border-red-500 text-red-500">
      Delete
    </button>

    <button class="px-6 py-2 border border-blue-500 text-blue-500">
      Cancel
    </button>

    <button class="px-6 py-2 bg-gray-300 text-gray-600 cursor-not-allowed">
      Save
    </button>

  </div>

</div>
