<div class="min-h-[calc(100vh-64px)] bg-slate-100 p-6">

  <!-- Welcome -->
 <div class="rounded-3xl bg-gradient-to-r from-[#fff] to-orange-500 p-8 text-[#FF9015] shadow-xl"><h1 class="text-3xl font-bold"> Welcome Back 👋 </h1><p class="mt-2 text-[#FF9015]"> Manage your users, vendors and inventory from one place. </p></div>

  <!-- Stats -->

  <div class="mt-8 grid gap-6 md:grid-cols-2 xl:grid-cols-3">

    <!-- Users -->

    <div
      class="group rounded-2xl bg-white p-6 shadow-sm transition duration-300 hover:-translate-y-2 hover:shadow-xl">

      <div class="flex items-center justify-between">

        <div>

          <p class="text-gray-500">
            Total Users
          </p>

          <h2 class="mt-3 text-4xl font-bold">
            245
          </h2>

        </div>

        <div
          class="flex h-16 w-16 items-center justify-center rounded-2xl bg-[#FF9015]/10 text-3xl">

          👤

        </div>

      </div>

      <div class="mt-6 h-2 rounded-full bg-gray-100">

        <div
          class="h-2 w-3/4 rounded-full bg-[#FF9015]">
        </div>

      </div>

    </div>

    <!-- Vendors -->

    <div
      class="group rounded-2xl bg-white p-6 shadow-sm transition duration-300 hover:-translate-y-2 hover:shadow-xl">

      <div class="flex items-center justify-between">

        <div>

          <p class="text-gray-500">
            Vendors
          </p>

          <h2 class="mt-3 text-4xl font-bold">
            82
          </h2>

        </div>

        <div
          class="flex h-16 w-16 items-center justify-center rounded-2xl bg-[#FF9015]/10 text-3xl">

          🏪

        </div>

      </div>

      <div class="mt-6 h-2 rounded-full bg-gray-100">

        <div
          class="h-2 w-2/3 rounded-full bg-[#FF9015]">
        </div>

      </div>

    </div>

    <!-- Items -->

    <div
      class="group rounded-2xl bg-white p-6 shadow-sm transition duration-300 hover:-translate-y-2 hover:shadow-xl">

      <div class="flex items-center justify-between">

        <div>

          <p class="text-gray-500">
            Items
          </p>

          <h2 class="mt-3 text-4xl font-bold">
            1380
          </h2>

        </div>

        <div
          class="flex h-16 w-16 items-center justify-center rounded-2xl bg-[#FF9015]/10 text-3xl">

          📦

        </div>

      </div>

      <div class="mt-6 h-2 rounded-full bg-gray-100">

        <div
          class="h-2 w-5/6 rounded-full bg-[#FF9015]">
        </div>

      </div>

    </div>

  </div>

  <!-- Bottom -->

  <div class="mt-8 grid gap-6 lg:grid-cols-2">

    <!-- Quick Actions -->

    <div class="rounded-2xl bg-white p-6 shadow-sm">

      <h3 class="text-xl font-semibold">
        Quick Actions
      </h3>

      <div class="mt-6 grid grid-cols-2 gap-4">

        <button (click)="goToPage('users')"
          class="rounded-xl bg-[#FF9015] p-4 font-semibold text-white transition hover:scale-105">

          + Add User

        </button>

        <button (click)="goToPage('vendors')"
          class="rounded-xl bg-[#FF9015] p-4 font-semibold text-white transition hover:scale-105">

          + Add Vendor

        </button>

        <button (click)="goToPage('items')"
          class="rounded-xl bg-[#FF9015] p-4 font-semibold text-white transition hover:scale-105">

          + Add Item

        </button>

        <button
          class="rounded-xl border-2 border-[#FF9015] p-4 font-semibold text-[#FF9015] transition hover:bg-[#FF9015] hover:text-white">

          View Reports

        </button>

      </div>

    </div>

    <!-- Recent Activity -->

    <div class="rounded-2xl bg-white p-6 shadow-sm">

      <h3 class="text-xl font-semibold">
        Recent Activity
      </h3>

      <div class="mt-6 space-y-5">

        <div class="flex items-center gap-4">

          <div
            class="h-3 w-3 rounded-full bg-[#FF9015]">
          </div>

          <div>

            <p class="font-medium">
              New User Added
            </p>

            <span class="text-sm text-gray-500">
              10 minutes ago
            </span>

          </div>

        </div>

        <div class="flex items-center gap-4">

          <div
            class="h-3 w-3 rounded-full bg-[#FF9015]">
          </div>

          <div>

            <p class="font-medium">
              Vendor Updated
            </p>

            <span class="text-sm text-gray-500">
              25 minutes ago
            </span>

          </div>

        </div>

        <div class="flex items-center gap-4">

          <div
            class="h-3 w-3 rounded-full bg-[#FF9015]">
          </div>

          <div>

            <p class="font-medium">
              Item Created
            </p>

            <span class="text-sm text-gray-500">
              1 hour ago
            </span>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>
