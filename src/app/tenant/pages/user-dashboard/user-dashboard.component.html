@if (loading()) {
  <div class="w-full px-4 py-5 sm:px-6 lg:px-8">
    <div class="rounded-xl border border-[#E8E8E8] bg-white p-6 shadow-sm">
      <p class="m-0 text-sm text-[#6F6F6F] font-ibm">
        Loading dashboard...
      </p>
    </div>
  </div>
} @else if (errorMessage()) {
  <div class="w-full px-4 py-5 sm:px-6 lg:px-8">
    <div class="rounded-xl border border-[#FECACA] bg-[#FEF2F2] px-4 py-4">
      <p class="m-0 text-sm text-[#B42318] font-ibm">{{ errorMessage() }}</p>
      <button
        type="button"
        class="mt-3 text-sm font-medium text-[#FF9015] hover:underline font-ibm"
        (click)="retry()"
      >
        Try again
      </button>
    </div>
  </div>
} @else if (employeeData(); as dashboard) {
  <app-employee-dashboard [data]="dashboard" />
} @else if (adminData(); as dashboard) {
  <app-tenant-admin-dashboard [data]="dashboard" />
}
