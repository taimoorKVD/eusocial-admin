<div class="p-6">

  <!-- TITLE -->
  <h2 class="text-[20px] font-semibold mb-4">Location Management</h2>

  <!-- FORM -->
  <form [formGroup]="locationForm" (ngSubmit)="submit()" class="bg-white p-5 rounded-xl shadow-sm">

    <div class="grid grid-cols-2 gap-4">

      <!-- NAME -->
      <div>
        <div class="flex items-center gap-3">
          <label class="w-[120px] text-sm text-gray-600">Name</label>
          <input type="text" formControlName="name" class="flex-1 border rounded-lg px-3 py-2 focus:outline-none">
        </div>

        <div *ngIf="locationForm.get('name')?.touched && locationForm.get('name')?.invalid"
          class="text-red-500 text-xs mt-1 ml-[120px]">
          Name is required
        </div>
      </div>

      <!-- COUNTRY -->
      <div>
        <div class="flex items-center gap-3">
          <label class="w-[120px] text-sm text-gray-600">Country</label>

          <select formControlName="country_id" class="flex-1 border rounded-lg px-3 py-2">
            <option [ngValue]="null">Select Country</option>
            <option *ngFor="let c of countries" [ngValue]="c.id">
              {{ c.name }}
            </option>
          </select>
        </div>
        <div *ngIf="locationForm.get('country_id')?.touched && locationForm.get('country_id')?.invalid"
          class="text-red-500 text-xs mt-1 ml-[120px]">
          Country is required
        </div>
      </div>

      <!-- STATE -->
      <div>
        <div class="flex items-center gap-3">
          <label class="w-[120px] text-sm text-gray-600">State</label>

          <select formControlName="state_id" class="flex-1 border rounded-lg px-3 py-2">
            <option [ngValue]="null">Select State</option>
            <option *ngFor="let s of states" [ngValue]="s.id">
              {{ s.name }}
            </option>
          </select>
        </div>
        <div *ngIf="locationForm.get('state_id')?.touched && locationForm.get('state_id')?.invalid"
          class="text-red-500 text-xs mt-1 ml-[120px]">
          State is required
        </div>
      </div>

      <!-- CITY -->
      <div>
        <div class="flex items-center gap-3">
          <label class="w-[120px] text-sm text-gray-600">City</label>

          <select formControlName="city_id" class="flex-1 border rounded-lg px-3 py-2">
            <option [ngValue]="null">Select City</option>
            <option *ngFor="let c of cities" [ngValue]="c.id">
              {{ c.name }}
            </option>
          </select>
        </div>
        <div *ngIf="locationForm.get('city_id')?.touched && locationForm.get('city_id')?.invalid"
          class="text-red-500 text-xs mt-1 ml-[120px]">
          City is required
        </div>
      </div>

      <!-- POSTAL -->
      <div>
        <div class="flex items-center gap-3">
          <label class="w-[120px] text-sm text-gray-600">Postal Code</label>
          <input type="text" formControlName="postalCode" class="flex-1 border rounded-lg px-3 py-2">
        </div>

        <div *ngIf="locationForm.get('postalCode')?.touched && locationForm.get('postalCode')?.invalid"
          class="text-red-500 text-xs mt-1 ml-[120px]">

          <span *ngIf="locationForm.get('postalCode')?.errors?.['required']">
            Postal code is required
          </span>

          <span *ngIf="locationForm.get('postalCode')?.errors?.['pattern']">
            Only numbers are allowed
          </span>

        </div>
      </div>

      <!-- LATITUDE -->
      <div>
        <div class="flex items-center gap-3">
          <label class="w-[120px] text-sm text-gray-600">Latitude</label>
          <input type="text" formControlName="latitude" class="flex-1 border rounded-lg px-3 py-2">
        </div>

        <div *ngIf="locationForm.get('latitude')?.touched && locationForm.get('latitude')?.invalid"
          class="text-red-500 text-xs mt-1 ml-[120px]">
          Enter valid decimal number
        </div>
      </div>

      <!-- LONGITUDE -->
      <div>
        <div class="flex items-center gap-3">
          <label class="w-[120px] text-sm text-gray-600">Longitude</label>
          <input type="text" formControlName="longitude" class="flex-1 border rounded-lg px-3 py-2">
        </div>

        <div *ngIf="locationForm.get('longitude')?.touched && locationForm.get('longitude')?.invalid"
          class="text-red-500 text-xs mt-1 ml-[120px]">
          Enter valid decimal number
        </div>
      </div>

    </div>

    <!-- ADDRESS -->
    <div class="flex items-start gap-3 mt-4">
      <label class="w-[120px] text-sm text-gray-600 pt-2">Address</label>
      <textarea formControlName="address" class="flex-1 border rounded-lg px-3 py-2 h-[80px] resize-none"></textarea>
    </div>

    <!-- BUTTONS -->
    <div class="flex justify-end gap-3 mt-5">

      <button type="submit" class="px-5 py-2 bg-black text-white rounded-lg">
        {{ selectedId ? 'Update' : 'Save' }}
      </button>
    </div>

  </form>
</div>
