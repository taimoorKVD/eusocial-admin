<div class="p-6">
  <app-top-header
    [title]="'Forms'"
    [buttonLabel]="'+ Create Form'"
    (buttonClick)="goToCreate()"
  />

  <div class="bg-white rounded shadow overflow-hidden mt-5">
    <table class="w-full text-left text-sm font-ibm">
      <thead class="bg-gray-200 text-gray-700">
        <tr>
          <th class="px-4 py-3">Form Name</th>
          <th class="px-4 py-3">Sections</th>
          <th class="px-4 py-3">Section Types</th>
          <th class="px-4 py-3">Created At</th>
          <th class="px-4 py-3 text-right">Actions</th>
        </tr>
      </thead>

      <tbody>
        @for (form of forms(); track form.id) {
          <tr class="border-b hover:bg-gray-50">
            <td class="px-4 py-3">{{ form.formName }}</td>
            <td class="px-4 py-3">{{ form.sectionCount }}</td>
            <td class="px-4 py-3">{{ formatSectionTypes(form.sectionTypes) }}</td>
            <td class="px-4 py-3">{{ form.createdAt | date: 'medium' }}</td>
            <td class="px-4 py-3 text-right">
              <button
                type="button"
                class="inline-flex items-center justify-center rounded-md p-1.5 text-[#ea580c] transition-colors hover:bg-orange-50"
                aria-label="Edit form"
                (click)="goToEdit(form)"
              >
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                  <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5Z"></path>
                </svg>
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>

    @if (!hasForms()) {
      <div class="text-center py-10">
        <p class="text-gray-400 text-sm font-ibm">No forms created yet</p>
        <button type="button" class="create-link font-ibm" (click)="goToCreate()">
          Create your first form
        </button>
      </div>
    }
  </div>
</div>
