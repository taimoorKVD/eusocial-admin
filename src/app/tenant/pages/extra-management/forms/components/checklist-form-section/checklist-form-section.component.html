<section class="section-card">
  <div class="section-card__header">
    <h3 class="section-card__title font-ibm">Checklist Form</h3>
    <div class="section-card__actions">
      <button
        type="button"
        class="section-icon-btn section-icon-btn--danger"
        aria-label="Remove section"
        (click)="removeSection.emit(section.id)"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
      </button>
    </div>
  </div>

  <div class="section-card__body">
    @for (row of section.rows; track trackRow($index, row)) {
      <div class="field-row">
        <div class="field-row__fields">
          @for (field of row.fields; track trackField($index, field)) {
            <div
              class="section-field"
              [class.section-field--added]="!field.isDefault"
            >
              @if (field.isDefault) {
                <label class="section-field__label font-ibm">
                  {{ field.label }}
                  @if (field.required) {
                    <span class="req">*</span>
                  }
                </label>
                <input
                  class="section-input font-ibm"
                  type="text"
                  [placeholder]="field.placeholder || field.label"
                  [value]="field.value || ''"
                  [attr.readonly]="field.readonly || null"
                  (input)="onFieldInput(row, field.id, $event)"
                />
              } @else {
                <app-section-field-preview
                  [field]="field"
                  (valueChange)="onFieldValueChange(row, field.id, $event)"
                />
                <button
                  type="button"
                  class="section-field__remove section-icon-btn section-icon-btn--danger"
                  aria-label="Remove field"
                  (click)="removeField(row, field.id)"
                >
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                  </svg>
                </button>
              }
            </div>
          }
        </div>

        <div class="field-row__actions">
          <button
            type="button"
            class="section-icon-btn section-icon-btn--accent"
            aria-label="Add field"
            (click)="requestAddField(row.id)"
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
        </div>
      </div>
    }
  </div>
</section>
