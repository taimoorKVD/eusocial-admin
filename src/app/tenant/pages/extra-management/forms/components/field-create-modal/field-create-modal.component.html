@if (isOpen) {
  <div
    class="field-modal-backdrop"
    role="dialog"
    aria-modal="true"
    aria-labelledby="field-modal-title"
    (click)="onBackdropClick($event)"
  >
    <div class="field-modal-panel field-modal-panel--builder">
      <div class="field-modal-header">
        <h3 id="field-modal-title" class="field-modal-title font-ibm">Add Field</h3>
        <button type="button" class="field-modal-close" aria-label="Close" (click)="close()">
          ×
        </button>
      </div>

      <div class="field-modal-body">
        <div class="field-type-picker font-ibm">
          <label class="field-type-picker__label" for="builder-field-type">Field Type</label>
          <select
            id="builder-field-type"
            class="field-type-picker__select"
            [ngModel]="selectedType()"
            (ngModelChange)="onTypeChange($event)"
          >
            @for (opt of typeOptions; track opt.value) {
              <option [value]="opt.value">{{ opt.label }}</option>
            }
          </select>
        </div>

        <div class="field-builder-host">
          <app-field-settings
            [field]="draftField()"
            [schema]="schema()"
            activeModuleName="dynamic-forms"
            (update)="onFieldUpdate($event)"
          />
        </div>

        <div class="field-modal-actions">
          <button type="button" class="btn btn--cancel font-ibm" (click)="close()">Cancel</button>
          <button
            type="button"
            class="btn btn--save font-ibm"
            [disabled]="!draftField().label?.trim()"
            (click)="submit()"
          >
            Add Field
          </button>
        </div>
      </div>
    </div>
  </div>
}
