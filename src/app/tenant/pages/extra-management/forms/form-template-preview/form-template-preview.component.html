<div class="min-h-[calc(100vh-4rem)] bg-[#f3f4f6] font-ibm">
  @if (!loading()) {
    @if (errorMessage()) {
      <div class="p-4 md:p-6">
        <button
          type="button"
          class="mb-4 inline-flex items-center gap-1.5 rounded-lg border border-[#E5E7EB] bg-white px-3 py-2 text-sm font-semibold text-[#111827] shadow-sm hover:bg-gray-50"
          (click)="goBack()"
        >
          ← Back to forms
        </button>
        <div class="rounded-xl border border-[#FECACA] bg-[#FEF2F2] px-4 py-4">
          <p class="m-0 text-sm text-[#B42318]">{{ errorMessage() }}</p>
          <button
            type="button"
            class="mt-3 text-sm font-medium text-[#FF9015] hover:underline"
            (click)="retry()"
          >
            Try again
          </button>
        </div>
      </div>
    } @else if (sections().length) {
      <app-regular-form-shell
        [sections]="sections()"
        [formTitle]="formTitle()"
        [canFill]="false"
        [previewMode]="true"
        [interactionMode]="'normal'"
        (exitRequested)="goBack()"
      ></app-regular-form-shell>
    } @else {
      <div class="p-4 md:p-6">
        <button
          type="button"
          class="mb-4 inline-flex items-center gap-1.5 rounded-lg border border-[#E5E7EB] bg-white px-3 py-2 text-sm font-semibold text-[#111827] shadow-sm hover:bg-gray-50"
          (click)="goBack()"
        >
          ← Back to forms
        </button>
        <div class="mx-auto max-w-3xl rounded-xl border border-[#E5E7EB] bg-white px-6 py-12 text-center shadow-sm">
          <p class="m-0 text-[0.6875rem] font-semibold uppercase tracking-[0.08em] text-[#9CA3AF]">Preview</p>
          <h2 class="mt-1 m-0 text-lg font-bold text-[#111827]">{{ formTitle() }}</h2>
          <p class="mt-3 m-0 text-sm text-[#6B7280]">
            This template has no sections or fields to preview yet.
          </p>
        </div>
      </div>
    }
  }
</div>
