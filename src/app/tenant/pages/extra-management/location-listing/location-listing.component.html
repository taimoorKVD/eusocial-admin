<div class="p-6">

  <!-- HEADER -->
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-[20px] font-semibold">Locations</h2>

    <button (click)="goToCreate()" class="bg-black text-white px-4 py-2 rounded-lg">
      + Create Location
    </button>
  </div>

  <!-- TABLE -->
  <div class="bg-white rounded-xl shadow-sm p-4">

    <table class="w-full text-sm">

      <thead>
        <tr class="border-b text-left">
          <th class="py-2">Name</th>
          <th>City</th>
          <th>Country</th>
          <th>Postal Code</th>
          <th class="text-right">Actions</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let loc of locations" class="border-b hover:bg-gray-50">

          <td class="py-2">{{ loc.name }}</td>
          <td>{{ loc.city }}</td>
          <td>{{ loc.country }}</td>
          <td>{{ loc.postalCode }}</td>

          <td class="text-right space-x-3">

            <!-- <button
              (click)="goToEdit(loc.id)"
              class="text-blue-500">
              Edit
            </button> -->
            <button (click)="goToEdit(loc.id)" class="text-blue-600 hover:text-blue-900">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
              </svg>
            </button>

            <!-- <button (click)="deleteLocation(loc.id)" class="text-red-500">
              Delete
            </button> -->
            <button (click)="deleteLocation(loc.id)" class="text-red-600 hover:text-red-900">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
              </svg>
            </button>

          </td>

        </tr>
      </tbody>

    </table>

  </div>

</div>
