<div class="p-6">
  <ng-container *ngIf="isLoading || deleting">
    <app-eu-loader></app-eu-loader>
  </ng-container>

  <app-confirm-modal
    [isOpen]="showBulkDeleteConfirmModal"
    title="Delete Locations"
    [description]="bulkDeleteConfirmDescription"
    confirmText="Delete"
    cancelText="Cancel"
    (confirmed)="onConfirmBulkDelete()"
    (closed)="closeBulkDeleteConfirmModal()">
  </app-confirm-modal>

  <app-top-header
    [title]="'Locations'"
    [buttonLabel]="'+ Create Location'"
    [showButton]="canCreate"
    (buttonClick)="goToCreate()">
  </app-top-header>

  <app-global-filter
    [fields]="filterFields"
    (search)="onFilterSearch($event)"
    (clear)="onFilterClear()">
  </app-global-filter>

  <div *ngIf="canDelete && bulkSelection.hasSelection()" class="mt-5 flex items-center justify-between gap-3 rounded bg-white px-4 py-3 shadow">
    <span class="text-sm font-ibm text-gray-500">
      Selected: {{ bulkSelection.count() }}
    </span>

    <button
      type="button"
      class="inline-flex items-center gap-2 rounded-lg border border-red-500/30 bg-red-500/10 px-3 py-1.5 text-sm font-medium text-red-500 transition hover:bg-red-500/20 disabled:cursor-not-allowed disabled:opacity-40 font-ibm"
      [disabled]="!bulkSelection.hasSelection()"
      (click)="openBulkDeleteConfirm()">
      Bulk Delete
    </button>
  </div>

  <!-- TABLE -->
  <div class="bg-white rounded shadow overflow-hidden mt-5">

    <table class="w-full text-left text-sm font-ibm">

      <thead class="bg-gray-200 text-gray-700">
        <tr>
          <th class="px-4 py-3 w-10" *ngIf="canDelete">
            <input
              type="checkbox"
              class="h-4 w-4 rounded border-gray-300 text-[#ea580c] focus:ring-[#ea580c]"
              [checked]="isAllSelected()"
              [indeterminate]="isIndeterminate()"
              [disabled]="selectableLocationIds().length === 0"
              (change)="toggleSelectAll()"
            />
          </th>
          <th class="px-4 py-3">Name</th>
          <th class="px-4 py-3">Country</th>
          <th class="px-4 py-3">State</th>
          <th class="px-4 py-3">City</th>
          <th class="px-4 py-3">Postal Code</th>
          <th class="px-4 py-3 text-right" *ngIf="canEdit || canDelete">Actions</th>
        </tr>
      </thead>

      <tbody>
        <tr
          *ngFor="let loc of locations"
          class="border-b hover:bg-gray-50"
          [class.bg-orange-50]="isSelected(loc)">

          <td class="px-4 py-3 w-10" *ngIf="canDelete">
            <input
              type="checkbox"
              class="h-4 w-4 rounded border-gray-300 text-[#ea580c] focus:ring-[#ea580c]"
              [checked]="isSelected(loc)"
              [disabled]="loc?.id == null"
              (change)="toggleSelect(loc)"
            />
          </td>
          <td class="px-4 py-3">{{ loc.name }}</td>
          <td class="px-4 py-3">{{ getName(countries, loc.countryId) }}</td>
          <td class="px-4 py-3">{{ getName(states, loc.stateId) }}</td>
          <td class="px-4 py-3">{{ getName(cities, loc.cityId) }}</td>
          <td class="px-4 py-3">{{ loc.postalCode }}</td>

          <td class="px-4 py-3 text-right flex justify-end gap-2" *ngIf="canEdit || canDelete">
            <button *ngIf="canEdit" (click)="goToEdit(loc.id)" class="text-blue-600 hover:text-blue-900">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
              </svg>
            </button>

            <button *ngIf="canDelete" (click)="deleteLocation(loc.id)" class="text-red-600 hover:text-red-900">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
              </svg>
            </button>
          </td>
        </tr>
      </tbody>

    </table>

    <!-- Empty State -->
    <div *ngIf="!isLoading && locations.length === 0" class="text-center py-10">
      <p class="text-gray-400 text-sm">No locations found</p>
    </div>

    <!-- Pagination -->
    <div *ngIf="locations.length > 0" class="flex flex-col gap-3 px-4 py-3 border-t border-gray-200 bg-white sm:flex-row sm:items-center sm:justify-between">

      <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:gap-4">
        <span class="text-sm text-gray-500">
          Page {{ page }} of {{ lastPage }}
        </span>
        <app-page-size-select
          [total]="total"
          [value]="pageSize"
          [disabled]="isLoading"
          (valueChange)="onPageSizeChange($event)"
        ></app-page-size-select>
      </div>

      <div class="flex items-center gap-2">

        <button
          class="px-3 py-1.5 rounded-lg text-sm font-medium border border-blue-200 bg-blue-50 text-blue-700 hover:bg-blue-100 transition disabled:opacity-40 disabled:cursor-not-allowed"
          [disabled]="page === 1" (click)="prevPage()">
          ← Prev
        </button>

        <button
          class="px-3 py-1.5 rounded-lg text-sm font-medium border border-blue-200 bg-blue-50 text-blue-700 hover:bg-blue-100 transition disabled:opacity-40 disabled:cursor-not-allowed"
          [disabled]="page === lastPage" (click)="nextPage()">
          Next →
        </button>

      </div>
    </div>

  </div>

</div>
