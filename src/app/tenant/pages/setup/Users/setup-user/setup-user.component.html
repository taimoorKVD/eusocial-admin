@if (loading()) {
  <app-eu-loader></app-eu-loader>
}

<div class="p-6 min-h-screen">

  <h2 class="text-[16px] font-medium mb-6 font-ibm text-[#ea580c]">
    Create / View Users
  </h2>

  @if (showEmptyState()) {
    <p class="text-[13px] text-[#A8A8A8] font-ibm">
      No form fields configured for users. Please set up the form in the Forms Editor.
    </p>
  }

  @if (hasFormFields()) {
    <app-dynamic-form
      [fields]="formFields()"
      (valueChange)="onDynamicFormChange($event)"
    ></app-dynamic-form>

    <div class="flex justify-end mt-8">
      <button
        type="button"
        (click)="onFormSubmit()"
        class="px-6 py-2.5 bg-[#ea580c] hover:bg-[#ea580c] text-white text-[13px] font-ibm font-medium rounded-lg transition-colors duration-150 disabled:opacity-50"
      >
        Submit
      </button>
    </div>
  }

</div>
