@if (loading()) {
  <app-eu-loader></app-eu-loader>
}

<div class="p-6 min-h-screen">

  <h2 class="text-[16px] font-medium mb-6 font-ibm text-[#ea580c]">
    Create / View Users
  </h2>

  @if (showEmptyState()) {
    <p class="text-[13px] text-[#A8A8A8] font-ibm">
      No form fields configured for users. Please set up the form in the Forms Editor.
    </p>
  }

  @if (hasFormFields()) {
    <app-dynamic-form
      [fields]="formFields()"
      (valueChange)="onDynamicFormChange($event)"
    ></app-dynamic-form>

    <div class="tenant-user-actions">
      <button type="button" class="btn btn--delete">
        Delete
      </button>

      <button type="button" class="btn btn--cancel">
        Cancel
      </button>

      <button
        type="button"
        (click)="onFormSubmit()"
        class="btn btn--save"
      >
        Save
      </button>
    </div>
  }

</div>
