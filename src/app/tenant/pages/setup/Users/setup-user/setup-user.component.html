<ng-container *ngIf="loading"><app-eu-loader></app-eu-loader></ng-container>

<div class="p-6 min-h-screen">

  <h2 class="text-[16px] font-medium mb-6 font-ibm text-[#0054AC]">
    Create/View Users
  </h2>

  <app-dynamic-form
    *ngIf="formFields.length"
    [fields]="formFields"
    (valueChange)="onDynamicFormChange($event)">
  </app-dynamic-form>

</div>
