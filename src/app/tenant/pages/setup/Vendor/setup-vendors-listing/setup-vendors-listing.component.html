 <ng-container *ngIf="loading">
    <app-eu-loader></app-eu-loader>
  </ng-container>
<div class="p-6 font-ibm">

  <app-top-header
    [title]="'Vendors Listing'"
    [buttonLabel]="' + Create Vendor'"
    (buttonClick)="goToCreate()">
  </app-top-header>

  <app-global-filter
    [fields]="filterFields"
    (search)="onFilterSearch($event)"
    (clear)="onFilterClear()">
  </app-global-filter>

  <div class="bg-white rounded shadow overflow-hidden mt-5">
    <table class="w-full text-left text-sm font-ibm">

      <thead class="bg-gray-200 text-gray-700">
        <tr>
          <th class="px-4 py-3">#</th>
          <th class="px-4 py-3">Name</th>
          <th class="px-4 py-3">City</th>
          <th class="px-4 py-3">Phone</th>
          <th class="px-4 py-3">Email</th>
          <th class="px-4 py-3">Min Order</th>
          <th class="px-4 py-3 text-right">Actions</th>
        </tr>
      </thead>

      <tbody>

        <tr *ngFor="let vendor of vendors; let i = index" class="border-b hover:bg-gray-50">

          <!-- <td class="px-4 py-3">{{ i + 1 }}</td> -->
           <td class="px-4 py-3">{{ (page - 1) * 15 + i + 1 }}</td>
          <td class="px-4 py-3">
            {{ vendor.name }}
          </td>

          <td class="px-4 py-3">
              {{ getCityName(vendor.city_id) }}
          </td>

          <td class="px-4 py-3">
            {{ vendor.phone_number }}
          </td>

          <td class="px-4 py-3">
            {{ vendor.email }}
          </td>

          <td class="px-4 py-3">
            {{ vendor.min_order }}
          </td>

          <!-- ACTIONS -->
          <td class="px-4 py-3 text-right flex justify-end gap-2">

            <!-- Edit -->
            <button [routerLink]="['edit', vendor.id]" class="text-blue-600 hover:text-blue-900">

              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="w-5 h-5">

                <path stroke-linecap="round" stroke-linejoin="round"
                  d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
              </svg>

            </button>

            <!-- Delete -->
            <button (click)="deleteVendor(vendor.id)" class="text-red-600 hover:text-red-900">

              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="w-5 h-5">

                <path stroke-linecap="round" stroke-linejoin="round"
                  d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
              </svg>

            </button>

          </td>

        </tr>

        <!-- Empty State -->
        <tr *ngIf="!vendors?.length">
          <td colspan="7" class="text-center py-6 text-gray-500">
            No vendors found
          </td>
        </tr>

      </tbody>

    </table>

    <div class="flex justify-between items-center px-4 py-3 border-t border-gray-200 bg-white">

      <span class="text-sm text-gray-500">
        Page {{ page }} of {{ lastPage }}
      </span>

      <div class="flex items-center gap-2">

        <button
          class="px-3 py-1.5 rounded-lg text-sm font-medium border border-blue-200 bg-blue-50 text-blue-700 hover:bg-blue-100 transition disabled:opacity-40 disabled:cursor-not-allowed"
          [disabled]="page === 1" (click)="prevPage()">

          ← Prev
        </button>

        <!-- Next -->
        <button
          class="px-3 py-1.5 rounded-lg text-sm font-medium border border-blue-200 bg-blue-50 text-blue-700 hover:bg-blue-100 transition disabled:opacity-40 disabled:cursor-not-allowed"
          [disabled]="page === lastPage" (click)="nextPage()">

          Next →
        </button>

      </div>
    </div>
  </div>

</div>
