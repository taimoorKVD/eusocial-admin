<div class="p-6 min-h-screen vendor">
  <div class="">

    <!-- Header -->
    <div class="grid grid-cols-3 gap-x-12 gap-y-6 mb-[60px] items-center">
      <div class="">
        <!-- Select Userss -->
        <div class="">
          <label class="text-[16px] font-medium text-[#0054AC] font-ibm mt-1 mb-4 block">Vendors</label>
          <!-- <ng-select [items]="vendors" bindLabel="label" bindValue="value" [(ngModel)]="chooseVendor"
            [searchable]="true" [clearable]="true" [placeholder]="!chooseVendor ? 'Choose an option' : ''"
            class="custom-ng-select text-[#161616]">
          </ng-select> -->
          <ng-select [items]="vendors" bindLabel="label" bindValue="value" [(ngModel)]="chooseVendor"
            [clearable]="true" [searchable]="true" (change)="onVendorChange()" class="custom-ng-select">
          </ng-select>
        </div>
      </div>
      <div></div>
      <div class="text-right">
        <button class="bg-orange-600 text-white px-4 py-2 text-sm w-fit">
          Edit +
        </button>
      </div>
    </div>

    <!-- Form Grid -->
    <div class="grid lg:grid-cols-3 grid-cols-1 gap-x-12 gap-y-6 mb-[24px]">
      <div>
        <input [(ngModel)]="formData.name" type="text" placeholder="Placeholder text"
          class="px-4 w-full border-b border-[#161616] placeholder-[#A8A8A8] text-[#161616] focus:outline-none font-ibm py-3 text-[14px] bg-transparent">
        <label class="text-[12px] text-[#6F6F6F] font-ibm mt-1 block">Vendor Name</label>
      </div>
    </div>

    <div class="grid lg:grid-cols-3 grid-cols-1 gap-x-12 gap-y-6">

      <!-- Left Column -->
      <div class="space-y-6">

        <div>
          <input [(ngModel)]="formData.address" type="text" placeholder="Placeholder text"
            class="px-4 w-full border-b border-[#161616] placeholder-[#A8A8A8] text-[#161616] focus:outline-none font-ibm py-3 text-[14px] bg-transparent">
          <label class="text-[12px] text-[#6F6F6F] font-ibm mt-1 block">Address</label>
        </div>

        <div>

          <input [(ngModel)]="formData.city" type="text" placeholder="Placeholder text"
            class="px-4 w-full border-b border-[#161616] placeholder-[#A8A8A8] text-[#161616] focus:outline-none font-ibm py-3 text-[14px] bg-transparent">
          <label class="text-[12px] text-[#6F6F6F] font-ibm mt-1 block">City</label>
        </div>

        <div>

          <input [(ngModel)]="formData.phone_number" type="text" placeholder="Placeholder text"
            class="px-4 w-full border-b border-[#161616] placeholder-[#A8A8A8] text-[#161616] focus:outline-none font-ibm py-3 text-[14px] bg-transparent">
          <label class="text-[12px] text-[#6F6F6F] font-ibm mt-1 block">Phone Number</label>
        </div>
      </div>

      <!-- Right Column -->
      <div class="space-y-6">
        <div>
          <select
            class="px-4 w-full border-b border-[#161616] placeholder-[#A8A8A8] text-[#161616] focus:outline-none font-ibm py-3 text-[14px] bg-transparent">
            <option>Choose an option</option>
          </select>
          <label class="text-[12px] text-[#6F6F6F] font-ibm mt-1 block">State</label>
        </div>

        <div>
          <select
            class="px-4 w-full border-b border-[#161616] placeholder-[#A8A8A8] text-[#161616] focus:outline-none font-ibm py-3 text-[14px] bg-transparent">
            <option>Choose an option</option>
          </select>
          <label class="text-[12px] text-[#6F6F6F] font-ibm mt-1 block">Country</label>
        </div>

        <div>
          <input [(ngModel)]="formData.email" type="email" placeholder="Placeholder text"
            class="px-4 w-full border-b border-[#161616] placeholder-[#A8A8A8] text-[#161616] focus:outline-none font-ibm py-3 text-[14px] bg-transparent">
          <label class="text-[12px] text-[#6F6F6F] font-ibm mt-1 block">Email Address</label>
        </div>
      </div>
    </div>

    <!-- Same Address -->
    <h3 class="mt-8 text-[16px] font-semibold text-[#525252]">Same Address</h3>

    <div class="grid grid-cols-3 gap-8 mt-4">
      <div>
        <input [(ngModel)]="formData.contacts[0].name" placeholder="Contact Person"
          class="px-4 w-full border-b border-[#161616] placeholder-[#A8A8A8] text-[#161616] focus:outline-none font-ibm py-3 text-[14px] bg-transparent">
        <label class="text-[12px] text-[#6F6F6F] font-ibm mt-1 block">Contact Person</label>
      </div>

      <div>
        <input [(ngModel)]="formData.contacts[0].phone_number" placeholder="Phone Number"
          class="px-4 w-full border-b border-[#161616] placeholder-[#A8A8A8] text-[#161616] focus:outline-none font-ibm py-3 text-[14px] bg-transparent">
        <label class="text-[12px] text-[#6F6F6F] font-ibm mt-1 block">Phone Number</label>
      </div>

      <div>
        <input [(ngModel)]="formData.contacts[0].email" placeholder="Email Address"
          class="px-4 w-full border-b border-[#161616] placeholder-[#A8A8A8] text-[#161616] focus:outline-none font-ibm py-3 text-[14px] bg-transparent">
        <label class="text-[12px] text-[#6F6F6F] font-ibm mt-1 block">Email Address</label>
      </div>

      <div>
        <input placeholder="Website"
          class="px-4 w-full border-b border-[#161616] placeholder-[#A8A8A8] text-[#161616] focus:outline-none font-ibm py-3 text-[14px] bg-transparent">
        <label class="text-[12px] text-[#6F6F6F] font-ibm mt-1 block">Website</label>
      </div>

      <div>
        <input placeholder="User Name"
          class="px-4 w-full border-b border-[#161616] placeholder-[#A8A8A8] text-[#161616] focus:outline-none font-ibm py-3 text-[14px] bg-transparent">
        <label class="text-[12px] text-[#6F6F6F] font-ibm mt-1 block">User Name</label>
      </div>

      <div>
        <input placeholder="Password"
          class="px-4 w-full border-b border-[#161616] placeholder-[#A8A8A8] text-[#161616] focus:outline-none font-ibm py-3 text-[14px] bg-transparent">
        <label class="text-[12px] text-[#6F6F6F] font-ibm mt-1 block">Password</label>
      </div>
    </div>

    <!-- Bottom Section -->
    <div class="grid grid-cols-3 gap-8 mt-10">

      <!-- Left -->
      <div>
        <label class="text-[16px] text-[#525252] font-ibm mt-1 block">Min Order</label>
        <input placeholder="Placeholder"
          class="px-4 w-full border-b border-[#161616] placeholder-[#A8A8A8] text-[#161616] focus:outline-none font-ibm py-3 text-[14px] bg-transparent">
      </div>

      <!-- Payment Terms -->
      <div>
        <label class="text-[12px] text-[#6F6F6F] font-ibm mt-1 block mb-2">
          Payment Terms
        </label>

        <div class="flex items-center gap-6">

          <!-- COD -->
          <div class="flex items-center gap-2 cursor-pointer" (click)="setPayment('COD')">
            <div class="w-8 h-4 rounded-full relative transition"
              [ngClass]="paymentType === 'COD' ? 'bg-orange-500' : 'bg-gray-300'">
              <div class="w-3 h-3 bg-white rounded-full absolute top-0.5 transition"
                [ngClass]="paymentType === 'COD' ? 'right-1' : 'left-1'"></div>
            </div>
            <span class="text-sm" [ngClass]="paymentType === 'COD' ? 'text-black' : 'text-gray-400'">
              COD
            </span>
          </div>

          <!-- EFT -->
          <div class="flex items-center gap-2 cursor-pointer" (click)="setPayment('EFT')">
            <div class="w-8 h-4 rounded-full relative transition"
              [ngClass]="paymentType === 'EFT' ? 'bg-orange-500' : 'bg-gray-300'">
              <div class="w-3 h-3 bg-white rounded-full absolute top-0.5 transition"
                [ngClass]="paymentType === 'EFT' ? 'right-1' : 'left-1'"></div>
            </div>
            <span class="text-sm" [ngClass]="paymentType === 'EFT' ? 'text-black' : 'text-gray-400'">
              EFT
            </span>
          </div>

        </div>
      </div>
    </div>

    <!-- Order Deadline -->
    <div class="mt-8">
      <label class="text-[16px] text-[#525252] font-ibm mt-1 block block mb-2">Order Deadline</label>

      <div class="flex gap-2 flex-wrap">
        <button *ngFor="let day of ['monday','tuesday','wednesday','thursday','friday','saturday','sunday']"
          (click)="toggleDay(day)"
          [ngClass]="formData.order_deadlines.includes(day) ? 'bg-blue-500 text-white' : 'bg-gray-200'">
          {{ day }}
        </button>
      </div>
    </div>

    <!-- Instructions -->
    <div class="grid grid-cols-3 gap-8">
      <div class="mt-8">
        <label class="text-[16px] text-[#525252] font-ibm mt-1 block block mb-1">Instructions</label>
        <textarea rows="4" class="w-full bg-transparent border-[3px] border-[#3387DF] text-sm p-2 focus:outline-none"
          placeholder="Lorem ipsum dolor sit amet..."></textarea>
        <p class="text-xs text-gray-400 mt-1">Helper text</p>
      </div>
    </div>

    <!-- Footer Buttons -->
    <div class="flex justify-end gap-3 mt-8">
      <button class="px-6 py-2 border border-red-500 text-red-500 text-sm">
        Delete
      </button>

      <button class="px-6 py-2 border border-gray-400 text-gray-600 text-sm">
        Cancel
      </button>

      <button class="px-6 py-2 bg-blue-600 text-white text-sm">
        Save
      </button>
    </div>

  </div>
</div>
