<div class="min-h-screen">

  <!-- Header -->
  <div class="px-[30px] pt-[30px] grid grid-cols-3 gap-x-12 gap-y-6 mb-[60px] items-center">
      <div class="">
        <!-- Select Items -->
        <div class="">
          <label class="text-[16px] font-medium text-[#0054AC] font-ibm mt-1 mb-4 block">Items</label>
          <ng-select [items]="items" bindLabel="label" bindValue="value" [(ngModel)]="chooseItems"
            [searchable]="true" [clearable]="true" [placeholder]="!chooseItems ? 'Choose an option' : ''"
            class="custom-ng-select text-[#161616]">
          </ng-select>
        </div>
      </div>
      <div></div>
      <div class="text-right">
        <button class="bg-orange-600 text-white px-4 py-2 text-sm w-fit">
          Edit +
        </button>
      </div>
    </div>

  <!-- Dropdown -->

  <!-- Form Grid -->
  <div class="px-[30px] grid grid-cols-1 lg:grid-cols-3 gap-10 mb-[30px]">

    <!-- Item Name -->
    <div>
      <input type="text" placeholder="Placeholder text"
        class="px-4 w-full border-b border-[#161616] placeholder-[#A8A8A8] text-[#161616] focus:outline-none font-ibm py-3 text-[14px] bg-transparent">
      <label class="text-[12px] text-[#6F6F6F] font-ibm mt-1 block">
        Item Name
      </label>
      </div>

    <!-- Item # -->
    <div>
      <input type="text" placeholder="Input text"
        class="px-4 w-full border-b border-[#161616] placeholder-[#A8A8A8] text-[#161616] focus:outline-none font-ibm py-3 text-[14px] bg-transparent">
      <label class="text-[12px] text-[#6F6F6F] font-ibm mt-1 block">
        Item #
      </label>
      </div>
  </div>


  <div class="px-[30px] grid grid-cols-1 lg:grid-cols-3 gap-10 mb-[30px]">
    <!-- Size -->
    <div>
      <input type="text" placeholder="Placeholder text"
        class="px-4 w-full border-b border-[#161616] placeholder-[#A8A8A8] text-[#161616] focus:outline-none font-ibm py-3 text-[14px] bg-transparent">
      <label class="text-[12px] text-[#6F6F6F] font-ibm mt-1 block">
        Size
      </label>
      </div>

    <!-- Cost -->
    <div>
      <input type="text" placeholder="Placeholder text"
        class="px-4 w-full border-b border-[#161616] placeholder-[#A8A8A8] text-[#161616] focus:outline-none font-ibm py-3 text-[14px] bg-transparent">
      <label class="text-[12px] text-[#6F6F6F] font-ibm mt-1 block">
        Cost
      </label>
      </div>
  </div>

  <div class="px-[30px] grid grid-cols-1 lg:grid-cols-3 gap-10 pb-[40px]" style="border-bottom: 1px solid rgba(108, 113, 114, 0.25);">
  <!-- Data Enter -->
    <div>
      <input type="text" placeholder="Placeholder text"
        class="px-4 w-full border-b border-[#161616] placeholder-[#A8A8A8] text-[#161616] focus:outline-none font-ibm py-3 text-[14px] bg-transparent">
      <label class="text-[12px] text-[#6F6F6F] font-ibm mt-1 block">
        Data Enter
      </label>
      </div>

    <!-- Par -->
    <div>
      <input type="text" placeholder="Placeholder text"
        class="px-4 w-full border-b border-[#161616] placeholder-[#A8A8A8] text-[#161616] focus:outline-none font-ibm py-3 text-[14px] bg-transparent">
      <label class="text-[12px] text-[#6F6F6F] font-ibm mt-1 block">
        Par
      </label>
      </div>
  </div>

  <div class="px-[30px] grid grid-cols-1 lg:grid-cols-3 gap-10">
    <!-- Text Input Section -->
    <div class="mt-10">
      <select
        class="px-4 w-full border-b border-[#161616] text-[#161616] focus:outline-none font-ibm py-3 text-[14px] bg-transparent">

        <option>Text Input</option>

        <option>
          Dropdown
        </option>

      </select>
      <label class="text-[12px] text-[#6F6F6F] font-ibm mt-1 block">
        Vendor
      </label>
    </div>
  </div>

  <!-- Category + Options -->
  <!-- <div class="mt-6 flex flex-col md:flex-row gap-6 items-start"> -->

    <!-- Category Dropdown -->
  <div class="px-[30px] mt-6 grid grid-cols-1 lg:grid-cols-3 gap-10">

    <!-- Category Dropdown -->
    <div class="">
      <label class="text-[12px] text-[#6F6F6F] font-ibm mt-1 block">
        Reporting Group
      </label>
      <select [(ngModel)]="selectedCategoryName" (ngModelChange)="onCategoryChange()"
        class="px-4 w-full border-b border-[#161616] text-[#161616] focus:outline-none font-ibm py-3 text-[14px] bg-transparent">

        <option [ngValue]="''">Select Category</option>

        <option *ngFor="let cat of categories" [ngValue]="cat.name">
          {{ cat.name }}
        </option>

      </select>
    </div>

    <!-- RIGHT SIDE (ONLY SHOW WHEN CATEGORY EXISTS) -->
    <div *ngIf="selectedCategory !== null"
  class="bg-[#F5F5F5] p-4 rounded-md w-full md:w-auto">

      <div *ngFor="let option of selectedCategory.options" class="flex items-center gap-2 mb-2">

        <input type="checkbox" [checked]="selectedOptions.includes(option)" (change)="toggleOption(option)">

        <label class="text-[14px] text-[#161616]">
          {{ option }}
        </label>
      </div>
    </div>
  </div>
  <!-- </div> -->

  <!-- Buttons -->
  <div class="px-[30px] pb-[30px] flex justify-end gap-3 mt-12">
    <button class="px-6 py-2 border border-red-500 text-red-500 text-sm">
      Delete
    </button>

    <button class="px-6 py-2 border border-blue-500 text-blue-500 text-sm">
      Cancel
    </button>

    <button class="px-6 py-2 bg-[#1D4ED8] text-white text-sm">
      Save
    </button>
  </div>

</div>
