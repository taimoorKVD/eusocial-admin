<div class="normal-form-shell font-ibm">
  <header class="normal-form-shell__header">
    <div class="normal-form-shell__header-row">
      <div class="normal-form-shell__identity">
        <button type="button" class="normal-form-shell__back" (click)="requestExit()">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 12H5M12 19l-7-7 7-7" />
          </svg>
          Back
        </button>

        @if (formTitle()) {
          <h1 class="normal-form-shell__title">{{ formTitle() }}</h1>
        }

        @if (dueDateLabel()) {
          <p class="normal-form-shell__due">Due: {{ dueDateLabel() }}</p>
        }
      </div>

      <div class="normal-form-shell__mode" role="group" aria-label="Form fill mode">
        <button
          type="button"
          class="normal-form-shell__mode-btn"
          [class.normal-form-shell__mode-btn--active]="isManualMode()"
          [attr.aria-pressed]="isManualMode()"
          (click)="setInteractionMode('manual')"
        >
          Regular Form
        </button>
        <button
          type="button"
          class="normal-form-shell__mode-btn"
          [class.normal-form-shell__mode-btn--active]="isVoiceMode()"
          [attr.aria-pressed]="isVoiceMode()"
          (click)="setInteractionMode('voice')"
        >
          Voice Reply
        </button>
        <button
          type="button"
          class="normal-form-shell__mode-btn"
          [class.normal-form-shell__mode-btn--active]="isNormalMode()"
          [attr.aria-pressed]="isNormalMode()"
          (click)="setInteractionMode('normal')"
        >
          Normal Form
        </button>
      </div>
    </div>
  </header>

  <div class="normal-form-shell__body">
    <div class="normal-form-shell__card">
      <app-dynamic-form
        [fields]="fields()"
        [enableLocationDependencies]="true"
        [typeformMode]="false"
      ></app-dynamic-form>

      @if (canFill()) {
        <div class="normal-form-shell__actions">
          <button
            type="button"
            class="normal-form-shell__submit"
            [disabled]="submitting()"
            (click)="submit()"
          >
            @if (submitting()) {
              Submitting…
            } @else {
              Submit Form
            }
          </button>
        </div>
      }
    </div>
  </div>
</div>
