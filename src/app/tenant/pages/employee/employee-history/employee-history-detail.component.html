<div
  class="w-full px-4 py-5 sm:px-6 lg:px-8 bg-[#FAFAFA] min-h-[calc(100vh-4rem)]"
>
  @if (loading()) {
    <app-eu-loader></app-eu-loader>
  }

  <button
    type="button"
    class="mb-4 text-sm font-medium text-[#FF9015] hover:underline font-ibm"
    (click)="goBack()"
  >
    ← Back to History
  </button>

  @if (errorMessage()) {
    <div class="rounded-xl border border-[#FECACA] bg-[#FEF2F2] px-4 py-4">
      <p class="m-0 text-sm text-[#B42318] font-ibm">{{ errorMessage() }}</p>
      <button
        type="button"
        class="mt-3 text-sm font-medium text-[#FF9015] hover:underline font-ibm"
        (click)="retry()"
      >
        Try again
      </button>
    </div>
  } @else if (!loading() && submission(); as current) {
    @if (hasContent()) {
      <app-completed-form-view
        [formTitle]="formTitle()"
        [sections]="sections()"
        [answers]="answers()"
        [submittedAt]="submittedAt()"
        [statusLabel]="statusLabel()"
        [statusClass]="statusClass()"
      ></app-completed-form-view>
    } @else {
      <div class="rounded-xl border border-[#E8E8E8] bg-white px-6 py-12 text-center shadow-sm">
        <h1 class="m-0 text-xl font-semibold text-[#161616] font-ibm">
          {{ formTitle() }}
        </h1>
        <p class="mt-3 m-0 text-sm text-[#6F6F6F] font-ibm">
          No submitted answers are available for this form.
        </p>
      </div>
    }
  }
</div>
