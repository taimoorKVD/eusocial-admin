<div class="global-filter bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">

  <!-- Header -->
  <div class="flex items-center gap-2 px-5 py-3 border-b border-gray-100 bg-gray-50/60">
    <svg class="w-4 h-4 text-[#0054AC] shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.04a2.25 2.25 0 0 1-.659 1.591l-5.432 5.432a2.25 2.25 0 0 0-.659 1.591v2.927a2.25 2.25 0 0 1-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 0 0-.659-1.591L3.659 7.409A2.25 2.25 0 0 1 3 5.818V4.774c0-.54.384-1.006.917-1.096A41.033 41.033 0 0 1 12 3Z" />
    </svg>
    <span class="text-sm font-medium text-gray-700 font-ibm">Filters</span>
    <span *ngIf="fields.length" class="text-xs text-gray-400 font-ibm">
      ({{ fields.length }} field{{ fields.length === 1 ? '' : 's' }})
    </span>
  </div>

  <div class="p-5">

    <!-- Dynamic field grid -->
    <div
      class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"
    >
      <div
        *ngFor="let field of fields; trackBy: trackByFieldKey"
        class="min-w-0 flex flex-col gap-1.5"
      >
        <label class="text-[11px] font-medium text-[#6F6F6F] font-ibm uppercase tracking-wide">
          {{ field.label }}
        </label>

        <ng-container [ngSwitch]="field.type">

          <!-- Select dropdown -->
          <div *ngSwitchCase="'select'" class="relative">
            <button
              type="button"
              (click)="toggleDropdown(field)"
              class="global-filter__control w-full px-3 py-2.5 rounded-lg border border-gray-200 bg-gray-50 text-sm text-gray-700 font-ibm focus:outline-none focus:ring-2 focus:ring-[#0054AC]/30 focus:border-[#0054AC] focus:bg-white transition-all duration-150 text-left flex items-center justify-between gap-2"
              [class.border-[#0054AC]]="isDropdownOpen(field)"
            >
              <span class="truncate" [class.text-gray-400]="!filters[field.key]">
                {{ getSelectDisplayLabel(field) }}
              </span>
              <svg
                class="w-4 h-4 text-gray-400 shrink-0 transition-transform duration-150"
                [class.rotate-180]="isDropdownOpen(field)"
                fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
              >
                <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
              </svg>
            </button>

            <div
              *ngIf="isDropdownOpen(field)"
              class="absolute z-30 mt-1.5 w-full rounded-lg border border-gray-200 bg-white shadow-lg overflow-hidden"
            >
              <div class="p-2 border-b border-gray-100">
                <input
                  type="text"
                  [value]="optionSearch[field.key] || ''"
                  (input)="onOptionSearch(field, $event)"
                  [placeholder]="'Search ' + field.label"
                  class="w-full px-3 py-2 rounded-md border border-gray-200 text-sm text-gray-700 font-ibm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#0054AC]/30 focus:border-[#0054AC]"
                />
              </div>

              <div class="max-h-52 overflow-y-auto p-1">
                <div *ngIf="field.loading" class="px-3 py-2 text-sm text-gray-500 font-ibm">
                  Loading options...
                </div>

                <button
                  *ngIf="!field.loading"
                  type="button"
                  (click)="selectOption(field)"
                  class="w-full text-left px-3 py-2 rounded-md text-sm font-ibm text-gray-600 hover:bg-gray-100 transition-colors"
                >
                  All
                </button>

                <button
                  *ngFor="let option of getFilteredOptions(field)"
                  type="button"
                  (click)="selectOption(field, option)"
                  class="w-full text-left px-3 py-2 rounded-md text-sm font-ibm text-gray-700 hover:bg-blue-50 hover:text-[#0054AC] transition-colors"
                  [class.bg-blue-50]="filters[field.key] == option.id"
                  [class.text-[#0054AC]]="filters[field.key] == option.id"
                >
                  {{ option.name }}
                </button>

                <div
                  *ngIf="!field.loading && getFilteredOptions(field).length === 0"
                  class="px-3 py-2 text-sm text-gray-500 font-ibm"
                >
                  No results found
                </div>
              </div>
            </div>
          </div>

          <!-- Text / email / number / date inputs -->
          <input
            *ngSwitchDefault
            [type]="field.type || 'text'"
            [(ngModel)]="filters[field.key]"
            (input)="onInputChange(field, $event)"
            (keyup.enter)="onSearch()"
            [placeholder]="field.placeholder || 'Enter ' + field.label"
            [attr.inputmode]="field.type === 'number' ? 'numeric' : null"
            [attr.pattern]="field.type === 'number' ? '[0-9]*' : null"
            class="global-filter__control w-full px-3 py-2.5 rounded-lg border border-gray-200 bg-gray-50 text-sm text-gray-700 font-ibm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#0054AC]/30 focus:border-[#0054AC] focus:bg-white transition-all duration-150"
          />
        </ng-container>
      </div>
    </div>

    <!-- Action buttons -->
    <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-2 sm:gap-3 mt-5 pt-4 border-t border-gray-100">
      <button
        type="button"
        (click)="onClear()"
        [disabled]="!hasFilters"
        class="inline-flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-lg border border-gray-200 bg-white hover:bg-gray-50 active:bg-gray-100 text-gray-600 text-sm font-medium font-ibm transition-all duration-150 disabled:opacity-40 disabled:cursor-not-allowed w-full sm:w-auto"
      >
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
        Clear
      </button>

      <button
        type="button"
        (click)="onSearch()"
        class="inline-flex items-center justify-center gap-1.5 px-5 py-2.5 rounded-lg bg-[#0054AC] hover:bg-[#0043A3] active:bg-[#003580] text-white text-sm font-medium font-ibm shadow-sm transition-all duration-150 w-full sm:w-auto"
      >
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
        </svg>
        Search
      </button>
    </div>

    <!-- Active filter chips -->
    <div
      *ngIf="hasFilters"
      class="flex flex-wrap items-center gap-2 mt-4 pt-4 border-t border-gray-100"
    >
      <span class="text-[11px] text-gray-400 font-ibm uppercase tracking-wide shrink-0">
        Active:
      </span>

      <span
        *ngFor="let field of activeFields; trackBy: trackByFieldKey"
        class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-blue-50 text-[#0054AC] text-xs font-medium font-ibm border border-blue-100"
      >
        <span class="text-gray-500">{{ field.label }}:</span>
        <span>{{ field.type === 'select' ? getSelectedOptionLabel(field) : filters[field.key] }}</span>
      </span>
    </div>

  </div>
</div>
