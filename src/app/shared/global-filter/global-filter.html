<div class="bg-white rounded-xl shadow-sm border border-gray-100 px-5 py-4">
  <div class="flex flex-col sm:flex-row gap-3 items-stretch sm:items-end">
    <div *ngFor="let field of fields; trackBy: trackByFieldKey" class="flex-1 min-w-0">
      <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase tracking-wide">{{
        field.label
      }}</label>
      <ng-container [ngSwitch]="field.type">
        <div *ngSwitchCase="'select'" class="relative">
          <button
            type="button"
            (click)="toggleDropdown(field)"
            class="w-full px-4 py-2.5 rounded-lg border border-gray-200 bg-gray-50 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 focus:bg-white transition duration-150 text-left flex items-center justify-between gap-2"
          >
            <span class="truncate" [class.text-gray-400]="!filters[field.key]">{{ getSelectDisplayLabel(field) }}</span>
            <!-- <span class="text-gray-400">▾</span> -->
          </button>

          <div
            *ngIf="isDropdownOpen(field)"
            class="absolute z-30 mt-1 w-full rounded-lg border border-gray-200 bg-white shadow-lg"
          >
            <div class="p-2 border-b border-gray-100">
              <input
                type="text"
                [value]="optionSearch[field.key] || ''"
                (input)="onOptionSearch(field, $event)"
                [placeholder]="'Search ' + field.label"
                class="w-full px-3 py-2 rounded-md border border-gray-200 text-sm text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400"
              />
            </div>

            <div class="max-h-56 overflow-y-auto p-1">
              <div *ngIf="field.loading" class="px-3 py-2 text-sm text-gray-500">Loading options...</div>

              <button
                *ngIf="!field.loading"
                type="button"
                (click)="selectOption(field)"
                class="w-full text-left px-3 py-2 rounded-md text-sm hover:bg-gray-100 transition"
              >
                All
              </button>

              <button
                *ngFor="let option of getFilteredOptions(field)"
                type="button"
                (click)="selectOption(field, option)"
                class="w-full text-left px-3 py-2 rounded-md text-sm hover:bg-blue-50 transition"
              >
                {{ option.name }}
              </button>

              <div
                *ngIf="!field.loading && getFilteredOptions(field).length === 0"
                class="px-3 py-2 text-sm text-gray-500"
              >
                No results found
              </div>
            </div>
          </div>
        </div>

        <input
          *ngSwitchDefault
          [type]="field.type || 'text'"
          [(ngModel)]="filters[field.key]"
          (input)="onInputChange(field, $event)"
          (keyup.enter)="onSearch()"
          [placeholder]="field.placeholder"
          [attr.inputmode]="field.type === 'number' ? 'numeric' : null"
          [attr.pattern]="field.type === 'number' ? '[0-9]*' : null"
          class="w-full px-4 py-2.5 rounded-lg border border-gray-200 bg-gray-50 text-sm text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 focus:bg-white transition duration-150"
        />
      </ng-container>
    </div>

    <div class="flex gap-2 sm:flex-shrink-0">
      <button
        type="button"
        (click)="onSearch()"
        class="flex items-center gap-1.5 px-5 py-2.5 rounded-lg bg-blue-500 hover:bg-blue-600 active:bg-blue-700 text-white text-sm font-medium shadow-sm transition duration-150 whitespace-nowrap"
      >
        Search
      </button>
      <button
        type="button"
        (click)="onClear()"
        [disabled]="!hasFilters"
        class="flex items-center gap-1.5 px-4 py-2.5 rounded-lg border border-gray-200 bg-white hover:bg-gray-50 active:bg-gray-100 text-gray-600 text-sm font-medium transition duration-150 whitespace-nowrap disabled:opacity-40 disabled:cursor-not-allowed"
      >
        Clear
      </button>
    </div>
  </div>

  <div *ngIf="hasFilters" class="flex flex-wrap gap-2 mt-3 pt-3 border-t border-gray-100">
    <span class="text-xs text-gray-400 self-center">Active filters:</span>
    <span
      *ngFor="let field of activeFields; trackBy: trackByFieldKey"
      class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-blue-50 text-blue-700 text-xs font-medium border border-blue-100"
    >
      {{ field.label }}:
      {{ field.type === 'select' ? getSelectedOptionLabel(field) : filters[field.key] }}
    </span>
  </div>
</div>
