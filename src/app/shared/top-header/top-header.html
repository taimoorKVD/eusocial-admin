<div class="flex justify-between items-center mb-4">
  <h2 class="text-[20px] font-semibold">{{ title }}</h2>

  <button
    *ngIf="showButton && buttonLabel"
    (click)="onButtonClick()"
    class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md text-sm transition duration-150"
  >
    {{ buttonLabel }}
  </button>
</div>
