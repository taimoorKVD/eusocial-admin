<form *ngIf="form" [formGroup]="form" class="max-w-[66%] dynamic-form ng-untouched ng-pristine ng-invalid" novalidate>
  <div class="grid grid-cols-2 gap-2">
    <div *ngFor="let field of sortedFields; trackBy: trackByField"
    >
      <div class="form-group mb-3">
        <label
          class="text-[12px] text-[#6F6F6F] font-ibm mt-1 block"
          [attr.for]="field.id"
        >
          {{ field.label }}
          <span *ngIf="field.required" class="text-red-600" aria-hidden="true">*</span>
        </label>

        <ng-container [ngSwitch]="field.type">
          <input
            *ngSwitchCase="'text'"
            class="w-full border-b border-[#161616] placeholder-[#A8A8A8] text-[#161616] focus:outline-none font-ibm py-3 text-[14px] bg-transparent"
            type="text"
            [id]="field.id"
            [formControlName]="field.name"
            [placeholder]="field.placeholder ?? ''"
          />

          <input
            *ngSwitchCase="'email'"
            class="w-full border-b border-[#161616] placeholder-[#A8A8A8] text-[#161616] focus:outline-none font-ibm py-3 text-[14px] bg-transparent"
            type="email"
            [id]="field.id"
            [formControlName]="field.name"
            [placeholder]="field.placeholder ?? ''"
          />

          <input
            *ngSwitchCase="'number'"
            class="w-full border-b border-[#161616] placeholder-[#A8A8A8] text-[#161616] focus:outline-none font-ibm py-3 text-[14px] bg-transparent"
            type="number"
            [id]="field.id"
            [formControlName]="field.name"
            [placeholder]="field.placeholder ?? ''"
          />

          <input
            *ngSwitchCase="'date'"
            class="w-full border-b border-[#161616] placeholder-[#A8A8A8] text-[#161616] focus:outline-none font-ibm py-3 text-[14px] bg-transparent"
            type="date"
            [id]="field.id"
            [formControlName]="field.name"
          />

          <input
            *ngSwitchCase="'image'"
            type="file"
            accept="image/*"
            class="w-full border-b border-[#161616] py-3 text-[14px] bg-transparent"
            [id]="field.id"
            (change)="onImageSelected($event, field.name)"
          />

          <div *ngIf="imagePreviews[field.name]" class="mt-2">
            <img
              [src]="imagePreviews[field.name]"
              alt="Preview"
              class="w-32 h-32 object-cover rounded border"
            />
          </div>

          <textarea
            *ngSwitchCase="'textarea'"
            class="w-full border-b border-[#161616] placeholder-[#A8A8A8] text-[#161616] focus:outline-none font-ibm py-3 text-[14px] bg-transparent"
            [id]="field.id"
            [formControlName]="field.name"
            [placeholder]="field.placeholder ?? ''"
            rows="4"
          ></textarea>

          <select
            *ngSwitchCase="'select'"
            class="w-full border-b border-[#161616] py-2 text-sm bg-transparent focus:outline-none"
            [id]="field.id"
            [formControlName]="field.name"
          >
            <option value="" [disabled]="field.required">
              {{ field.placeholder || 'Select ' + field.label }}
            </option>
            <option
              *ngFor="let option of field.options; "
              [ngValue]="getOptionValue(option)"
            >
              {{ getOptionLabel(option) }}
            </option>
          </select>

          <div *ngSwitchCase="'checkbox'" class="form-check">
            <div
              *ngFor="let option of field.options; let i = index"
              class="form-check"
            >
              <input
                class="form-check-input h-4 w-4 border-gray-300 text-indigo-600 focus:ring-indigo-500"
                type="checkbox"
                [id]="field.id + '-' + i"
                [formControlName]="field.name"
                [value]="getOptionValue(option, i)"
              />
              <label class="form-check-label text-sm text-gray-700 ms-2" [attr.for]="field.id + '-' + i">
                {{ getOptionLabel(option) }}
              </label>
            </div>
          </div>

          <div *ngSwitchCase="'radio'" class="radio-group" role="radiogroup" [attr.aria-labelledby]="field.id + '-label'">
            <div
              *ngFor="let option of field.options; let i = index"
              class="form-check"
            >
              <input
                class="form-check-input h-4 w-4 border-gray-300 text-indigo-600 focus:ring-indigo-500"
                type="radio"
                [id]="field.id + '-' + i"
                [formControlName]="field.name"
                [value]="getOptionValue(option, i)"
              />
              <label class="form-check-label text-sm text-gray-700 ms-2" [attr.for]="field.id + '-' + i">
                {{ getOptionLabel(option) }}
              </label>
            </div>
          </div>

        </ng-container>

        <small *ngIf="getErrorMessage(field) as errorMessage" class="error text-red-600 d-block mt-1">
          {{ errorMessage }}
        </small>
      </div>
    </div>
  </div>
</form>
