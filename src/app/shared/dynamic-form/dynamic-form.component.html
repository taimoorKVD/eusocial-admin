<!-- <pre style="position:fixed;top:0;background-color: black; color: white; font-weight: 600;opacity: 0.8;z-index: 9999;left: 5px !important; width: 18%; height: 600px;overflow: scroll;">{{  form?.getRawValue()  | json }}</pre> -->

<form *ngIf="form" [formGroup]="form" class="dynamic-form" novalidate>
  <div class="grid grid-cols-1 gap-5 md:grid-cols-2 md:gap-6">
    <div
      *ngFor="let field of sortedFields; trackBy: trackByField"
      [ngClass]="{ 'col-span-2': field.type === 'image' || field.type === 'textarea' || field.label === 'Availability Days' }"
      class="field-shell"
    >
      <div class="form-group">
        <label
          *ngIf="field.type !== 'image'"
          class="field-label"
          [attr.for]="field.id"
        >
          {{ field.label }}
          <span *ngIf="field.required" class="field-required" aria-hidden="true">*</span>
        </label>

        <ng-container [ngSwitch]="field.type">

          <!-- ── text ─────────────────────────────────────────────────────────── -->
           <ng-container *ngSwitchCase="'text'">
            <div *ngIf="field.name === 'password'; else normalText"
                class="relative">

              <input
                class="dynamic-control pr-12"
                [type]="showPasswords[field.name] ? 'text' : 'password'"
                [id]="field.id"
                [formControlName]="field.name"
                [placeholder]="field.placeholder ?? ''"
              />

              <button
                type="button"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700"
                (click)="togglePassword(field.name)"
              >
                <!-- SHOW PASSWORD (eye open) -->
                <svg
                  *ngIf="!showPasswords[field.name]"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  class="w-5 h-5"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7s-8.268-2.943-9.542-7z"
                  />
                  <circle cx="12" cy="12" r="3" />
                </svg>

                <svg
                  *ngIf="showPasswords[field.name]"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  class="w-5 h-5"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M3 3l18 18M10.584 10.587A2 2 0 0012 14a2 2 0 001.414-.586M9.88 5.09A9.77 9.77 0 0112 5c4.478 0 8.268 2.943 9.542 7a9.956 9.956 0 01-4.293 5.132M6.228 6.228A9.956 9.956 0 002.458 12c1.274 4.057 5.064 7 9.542 7a9.77 9.77 0 003.09-.495"
                  />
                </svg>
              </button>

            </div>

            <ng-template #normalText>
              <input
                class="dynamic-control"
                type="text"
                [id]="field.id"
                [formControlName]="field.name"
                [placeholder]="field.placeholder ?? ''"
              />
            </ng-template>

          </ng-container>


          <!-- ── email ─────────────────────────────────────────────────────────── -->
          <input
            *ngSwitchCase="'email'"
            class="dynamic-control"
            type="email"
            [id]="field.id"
            [formControlName]="field.name"
            [placeholder]="field.placeholder ?? ''"
          />

          <!-- ── number ────────────────────────────────────────────────────────── -->
          <input
            *ngSwitchCase="'number'"
            class="dynamic-control"
            type="number"
            [id]="field.id"
            [formControlName]="field.name"
            [placeholder]="field.placeholder ?? ''"
          />

          <!-- ── date ──────────────────────────────────────────────────────────── -->
          <input
            *ngSwitchCase="'date'"
            class="dynamic-control"
            type="date"
            [id]="field.id"
            [formControlName]="field.name"
          />

          <!-- ── textarea ──────────────────────────────────────────────────────── -->
          <textarea
            *ngSwitchCase="'textarea'"
            class="dynamic-control min-h-[120px] resize-none"
            [id]="field.id"
            [formControlName]="field.name"
            [placeholder]="field.placeholder ?? ''"
            rows="3"
          ></textarea>

          <!-- ── select ────────────────────────────────────────────────────────── -->
          <select
            *ngSwitchCase="'select'"
            class="dynamic-control"
            [id]="field.id"
            [formControlName]="field.name"
          >
            <option value="">{{  'Select ' + field.label }}</option>
            <option
              *ngFor="let option of field.options; trackBy: trackByOption;"
              [ngValue]="getOptionValue(option)"
            >
              {{ getOptionLabel(option) }}
            </option>
              <option
              *ngIf="!field.options?.length"
              disabled
              value=""
            >
              No records found
            </option>
          </select>

          <!-- ── checkbox ──────────────────────────────────────────────────────── -->
          <div *ngSwitchCase="'checkbox'" class="option-group option-group--checkbox">
              <div formArrayName="{{ field.name }}" class="checkbox-wrapper">
                <div
                  *ngFor="let option of field.options; let i = index"
                  class="option-item"
                >
                 <input
                    type="checkbox"
                    class="option-input"
                    [id]="field.name + '_' + i"
                    [checked]="isChecked(field.name, getOptionValue(option))"
                    (change)="onMultiCheckboxChange(field.name, getOptionValue(option), $event)"
                  />
                  <label class="option-label" [for]="field.name + '_' + i">
                    {{ getOptionLabel(option) }}
                  </label>
                </div>
              </div>
          </div>

          <!-- ── radio ─────────────────────────────────────────────────────────── -->
          <div *ngSwitchCase="'radio'" class="option-group option-group--radio" role="radiogroup">
            <div
              *ngFor="let option of field.options; trackBy: trackByOption; let i = index"
              class="option-item option-item--radio"
            >
              <input
                class="option-input"
                type="radio"
                [id]="field.id + '-' + i"
                [formControlName]="field.name"
                [value]="getOptionValue(option, i)"
              />
              <label class="option-label" [attr.for]="field.id + '-' + i">
                {{ getOptionLabel(option) }}
              </label>
            </div>
          </div>

          <!-- ── image ─────────────────────────────────────────────────────────── -->
          <ng-container *ngSwitchCase="'image'">

            <!-- Hidden file input — always present, id linked to outer click zone -->
            <input
              #imgInput
              type="file"
              [id]="field.id"
              accept=".jpg,.jpeg,.png,.webp"
              class="sr-only"
              (change)="onImageSelected($event, field.name)"
            />

            <!-- Upload zone — shown when no image is selected -->
            <div
              *ngIf="!imagePreviews[field.name]"
              (click)="imgInput.click()"
              (keydown.enter)="imgInput.click()"
              (keydown.space)="$event.preventDefault(); imgInput.click()"
              role="button"
              tabindex="0"
              class="upload-zone"
              [class.border-red-400]="getErrorMessage(field)"
              [class.bg-red-50]="getErrorMessage(field)"
            >
              <!-- Upload cloud icon -->
              <svg class="upload-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M12 16.5v-9m0 0-3 3m3-3 3 3M6.75 19.5a4.5 4.5 0 0 1-1.41-8.775 5.25 5.25 0 0 1 10.338-1.382A4.501 4.501 0 0 1 17.25 19.5H6.75Z" />
              </svg>
              <p class="upload-title">
                {{ field.label }}
                <span *ngIf="field.required" class="field-required">*</span>
              </p>
              <p class="upload-hint">Click to upload &mdash; JPG, JPEG, PNG, WEBP</p>
            </div>

            <!-- Preview card — shown when an image is selected -->
            <div *ngIf="imagePreviews[field.name]" class="image-preview-card">

              <!-- Thumbnail with overlay actions -->
              <div class="image-preview-thumb group">
                <img
                  [src]="imagePreviews[field.name]"
                  [alt]="field.label + ' preview'"
                  class="image-preview-img"
                />

                <!-- Dark overlay on hover -->
                <div class="image-preview-overlay"></div>

                <!-- Remove button -->
                <button
                  type="button"
                  (click)="removeImage(field.name, imgInput)"
                  class="image-remove-button"
                  aria-label="Remove image"
                >
                  <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                  </svg>
                </button>
              </div>

              <!-- File info + change button -->
              <div class="image-preview-meta">
                <p class="image-preview-title">Image selected</p>
                <p class="image-preview-subtitle">JPG · JPEG · PNG · WEBP</p>
                <button
                  type="button"
                  (click)="imgInput.click()"
                  class="image-preview-action"
                >
                  <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L6.832 19.82a4.5 4.5 0 0 1-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 0 1 1.13-1.897L16.863 4.487Zm0 0L19.5 7.125" />
                  </svg>
                  Change image
                </button>
              </div>
            </div>

          </ng-container>

        </ng-container>

        <!-- Validation error -->
        <small
          *ngIf="getErrorMessage(field) as msg"
          class="field-error"
        >
          {{ msg }}
        </small>
      </div>
    </div>

  </div>
</form>
