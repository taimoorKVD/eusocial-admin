<div class="dynamic-listing bg-white rounded shadow">

  <!-- Toolbar -->
  <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100">
    <p class="text-sm text-gray-500 font-ibm m-0">
      Showing {{ visibleColumns.length }} of {{ sortedFields.length }} columns
    </p>

    <div
      class="relative"
      appDropdownPanel
      #columnMenu="dropdownPanel"
      [dropdownId]="columnDropdownId"
      [dropdownGroup]="columnDropdownGroup"
    >
      <button
        type="button"
        class="inline-flex items-center gap-2 px-3 py-2 text-sm font-ibm text-[#ea580c] border border-[#ea580c]/30 rounded-lg hover:bg-blue-50 transition-colors"
        (click)="columnMenu.toggle($event)"
        aria-label="Select columns"
        [attr.aria-expanded]="columnMenu.isOpen"
      >
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M10.5 6h9.75M10.5 6a1.5 1.5 0 1 1-3 0m3 0a1.5 1.5 0 1 0-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-9.75 0h9.75" />
        </svg>
        Columns
      </button>

      <!-- Column selector dropdown -->
      <div
        *ngIf="columnMenu.isOpen"
        class="column-selector absolute right-0 mt-2 w-72 bg-white border border-gray-200 rounded-xl shadow-lg z-20"
      >
        <div class="px-4 py-3 border-b border-gray-100">
          <p class="text-sm font-medium text-gray-800 font-ibm m-0">Visible columns</p>
          <p class="text-xs text-gray-500 font-ibm mt-1 mb-0">Choose which fields appear in the table.</p>
        </div>

        <div class="max-h-[7rem] overflow-y-auto py-2">
          <label
            *ngFor="let field of sortedFields; trackBy: trackByFieldId"
            class="flex items-center gap-3 px-4 py-2 hover:bg-gray-50 cursor-pointer"
          >
            <input
              type="checkbox"
              class="h-4 w-4 rounded border-gray-300 text-[#ea580c] focus:ring-[#ea580c]"
              [checked]="isColumnVisible(field.id)"
              (change)="onColumnToggle(field, $any($event.target).checked)"
            />
            <span class="text-sm text-gray-700 font-ibm">{{ field.label }}</span>
          </label>
        </div>
      </div>
    </div>
  </div>

  <!-- Table -->
  <div class="overflow-x-auto" *ngIf="hasRecords">
    <table class="w-full text-left text-sm font-ibm">
      <thead class="bg-gray-200 text-gray-700">
        <tr>
          <th
            *ngFor="let field of visibleColumns; trackBy: trackByFieldId"
            class="px-4 py-3 whitespace-nowrap"
          >
            {{ field.label }}
          </th>
          <th *ngIf="showActions" class="px-4 py-3 text-right whitespace-nowrap">Actions</th>
        </tr>
      </thead>

      <tbody>
        <tr
          *ngFor="let record of records; trackBy: trackByRecordId"
          class="border-b hover:bg-gray-50"
        >
          <td
            *ngFor="let field of visibleColumns; trackBy: trackByFieldId"
            class="px-4 py-3 align-middle"
          >
            <ng-container [ngSwitch]="field.type">
              <ng-container *ngSwitchCase="'image'">
                <img
                  *ngIf="getImageSrc(record, field); else noImage"
                  [src]="getImageSrc(record, field)!"
                  [alt]="field.label"
                  class="w-10 h-10 rounded object-cover border border-gray-200"
                />
                <ng-template #noImage>
                  <span class="text-gray-400">—</span>
                </ng-template>
              </ng-container>
              <ng-container *ngIf="field.type === 'checkbox'; else normalCell">
                <span *ngFor="let item of splitValue(getCellValue(record, field))"
                  class="inline-flex items-center gap-1 mr-1 mb-1 px-2.5 py-1 rounded-full text-xs font-medium transition-all duration-150 hover:scale-[1.03]"
                  [ngClass]="getFieldClass(field)"
                >
                  {{ item }}
                </span>
              </ng-container>

              <ng-template #normalCell>
                <span>
                  {{ getCellValue(record, field) }}
                </span>
              </ng-template>
            </ng-container>
          </td>

          <td *ngIf="showActions" class="px-4 py-3 text-right">
            <div class="flex justify-end gap-2">
              <button
                type="button"
                class="text-[#ea580c] hover:text-red-900"
                (click)="onEdit(record)"
                aria-label="Edit record"
              >
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                  stroke="currentColor" class="w-5 h-5">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
                </svg>
              </button>

              <button
                type="button"
                class="text-red-600 hover:text-red-900"
                (click)="onDelete(record)"
                aria-label="Delete record"
              >
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                  stroke="currentColor" class="w-5 h-5">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                </svg>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Empty state -->
  <div *ngIf="!hasRecords" class="text-center py-10">
    <p class="text-gray-400 text-sm font-ibm m-0">{{ emptyMessage }}</p>
  </div>

</div>
