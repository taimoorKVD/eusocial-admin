@if (isOpen) {
  <div
    class="confirm-modal-backdrop"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="'confirm-modal-title'"
    (click)="onBackdropClick($event)"
  >
    <div class="confirm-modal-panel">
      <p id="confirm-modal-title" class="confirm-modal-message font-ibm">
        {{ displayMessage }}
      </p>

      <div class="confirm-modal-actions">
        <button
          type="button"
          class="confirm-modal-btn confirm-modal-btn--cancel font-ibm"
          (click)="onClose()"
        >
          {{ cancelText }}
        </button>

        <button
          type="button"
          class="confirm-modal-btn confirm-modal-btn--confirm font-ibm"
          (click)="onConfirm()"
        >
          {{ confirmText }}
        </button>
      </div>
    </div>
  </div>
}
