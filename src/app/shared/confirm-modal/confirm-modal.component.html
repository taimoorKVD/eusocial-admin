@if (isOpen) {
  <div
    class="confirm-modal-backdrop"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="'confirm-modal-title'"
    (click)="onBackdropClick($event)"
  >
    <div class="confirm-modal-panel">
      <h2 id="confirm-modal-title" class="confirm-modal-title font-ibm">
        {{ title }}
      </h2>

      @if (displayDescription) {
        <p class="confirm-modal-description font-ibm">
          {{ displayDescription }}
        </p>
      }

      <div class="confirm-modal-actions">
        <button
          type="button"
          class="confirm-modal-btn confirm-modal-btn--secondary font-ibm"
          (click)="onClose()"
        >
          {{ cancelText }}
        </button>

        <button
          type="button"
          class="confirm-modal-btn btn btn--cancel font-ibm"
          (click)="onConfirm()"
        >
          {{ confirmText }}
        </button>
      </div>
    </div>
  </div>
}
