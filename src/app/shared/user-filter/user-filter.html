<div class="bg-white rounded-xl shadow-sm border border-gray-100 px-5 py-4">
  <div class="flex flex-col sm:flex-row gap-3 items-stretch sm:items-end">

    <!-- Name Filter -->
    <div class="flex-1 min-w-0">
      <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase tracking-wide">
        Name
      </label>
      <div class="relative">
        <span class="absolute inset-y-0 left-3 flex items-center pointer-events-none text-gray-400">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
            stroke-width="1.8" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
          </svg>
        </span>
        <input
          type="text"
          [(ngModel)]="name"
          (keyup.enter)="onSearch()"
          placeholder="Search by name…"
          class="w-full pl-9 pr-4 py-2.5 rounded-lg border border-gray-200 bg-gray-50 text-sm text-gray-700
                 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-400
                 focus:border-blue-400 focus:bg-white transition duration-150"
        />
      </div>
    </div>

    <!-- Email Filter -->
    <div class="flex-1 min-w-0">
      <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase tracking-wide">
        Email
      </label>
      <div class="relative">
        <span class="absolute inset-y-0 left-3 flex items-center pointer-events-none text-gray-400">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
            stroke-width="1.8" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5
                 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0
                 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0
                 1-1.07-1.916V6.75" />
          </svg>
        </span>
        <input
          type="email"
          [(ngModel)]="email"
          (keyup.enter)="onSearch()"
          placeholder="Search by email…"
          class="w-full pl-9 pr-4 py-2.5 rounded-lg border border-gray-200 bg-gray-50 text-sm text-gray-700
                 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-400
                 focus:border-blue-400 focus:bg-white transition duration-150"
        />
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex gap-2 sm:flex-shrink-0">
      <button type="button"
        (click)="onSearch()"
        class="flex items-center gap-1.5 px-5 py-2.5 rounded-lg bg-blue-500 hover:bg-blue-600
               active:bg-blue-700 text-white text-sm font-medium shadow-sm transition duration-150
               whitespace-nowrap" >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
          stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
        </svg>
        Search
      </button>
      <button type="button"
        (click)="onClear()"
        [disabled]="!hasFilters"
        class="flex items-center gap-1.5 px-4 py-2.5 rounded-lg border border-gray-200 bg-white
               hover:bg-gray-50 active:bg-gray-100 text-gray-600 text-sm font-medium transition
               duration-150 whitespace-nowrap disabled:opacity-40 disabled:cursor-not-allowed">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
          stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
        Clear
      </button>
    </div>
  </div>

  <!-- Active filter badges -->
  <div *ngIf="hasFilters" class="flex flex-wrap gap-2 mt-3 pt-3 border-t border-gray-100">
    <span class="text-xs text-gray-400 self-center">Active filters:</span>
    <span *ngIf="name"
      class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-blue-50 text-blue-700
             text-xs font-medium border border-blue-100">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24"
        stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
      </svg>
      {{ name }}
    </span>
    <span *ngIf="email"
      class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-blue-50 text-blue-700
             text-xs font-medium border border-blue-100">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24"
        stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5
             0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0
             1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0
             1-1.07-1.916V6.75" />
      </svg>
      {{ email }}
    </span>
  </div>
</div>
