<div class="platform-page plan-form-page">
  <div class="platform-page__actions">
    <button type="button" class="btn-ghost" (click)="back()">Back</button>
  </div>

  <div class="platform-state" *ngIf="loading">
    <div class="platform-spinner"></div>
    <p>Loading…</p>
  </div>

  <form *ngIf="!loading" [formGroup]="form" (ngSubmit)="save()" class="platform-card form-card">
    <div class="form-grid">
      <div>
        <label>Plan Name</label>
        <input type="text" formControlName="name" placeholder="e.g. Professional" />
        <small class="error" *ngIf="f['name'].touched && f['name'].errors?.['required']">Name is required.</small>
      </div>
      <div>
        <label>Slug</label>
        <input type="text" formControlName="slug" placeholder="professional" />
      </div>
      <div class="full">
        <label>Description</label>
        <textarea rows="2" formControlName="description" placeholder="Short plan description"></textarea>
      </div>
      <div>
        <label>Price ($)</label>
        <input type="number" formControlName="price" min="0" step="0.01" />
      </div>
      <div>
        <label>Billing Cycle</label>
        <select formControlName="billingCycle">
          <option value="monthly">Monthly</option>
          <option value="yearly">Yearly</option>
        </select>
      </div>
      <div>
        <label>Users Limit</label>
        <input type="number" formControlName="usersLimit" min="0" />
        <label class="checkbox mt">
          <input type="checkbox" formControlName="unlimitedUsers" (change)="onUnlimitedChange()" />
          Unlimited users
        </label>
      </div>
      <div>
        <label>Storage (GB)</label>
        <input type="number" formControlName="storageGb" min="0" />
      </div>
      <div>
        <label>Support Level</label>
        <input type="text" formControlName="supportLevel" placeholder="Email support" />
      </div>
      <div>
        <label>Trial Days</label>
        <input type="number" formControlName="trialDays" min="0" />
      </div>
      <div>
        <label>Sort Order</label>
        <input type="number" formControlName="sortOrder" min="0" />
      </div>
      <div>
        <label>Status</label>
        <select formControlName="status">
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
      </div>
      <div class="full">
        <label>Features (one per line)</label>
        <textarea rows="4" [(ngModel)]="featuresText" [ngModelOptions]="{standalone: true}" placeholder="50 users&#10;100 GB storage&#10;Priority support"></textarea>
      </div>
    </div>

    <div class="modules-block">
      <h3>Allowed Modules</h3>
      <p>Select modules tenants on this plan can access. Dashboard is always included.</p>
      <div class="modules-grid">
        <label class="module-item" *ngFor="let mod of modules" [class.is-locked]="mod.key === 'dashboard'">
          <input
            type="checkbox"
            [checked]="isModuleChecked(mod.key)"
            [disabled]="mod.key === 'dashboard'"
            (change)="toggleModule(mod.key, $any($event.target).checked)"
          />
          <span>
            <strong>{{ mod.name }}</strong>
            <small>{{ mod.description }}</small>
          </span>
        </label>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn-ghost" (click)="back()">Cancel</button>
      <button type="submit" class="btn-primary" [disabled]="saving">
        {{ saving ? 'Saving...' : (isEditMode ? 'Update Plan' : 'Create Plan') }}
      </button>
    </div>
  </form>
</div>
