<div class="user-form p-4 md:px-6 md:py-4">
    <!-- Header -->
    <div class="flex justify-between items-center mb-4">
        <h3 class="text-xl font-semibold text-gray-800 m-0">
            {{ isEditMode ? 'Edit User' : 'Create User' }}
        </h3>
        <button class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg transition duration-150" (click)="backToList()">
            <i class="bi bi-arrow-left mr-2"></i> Back
        </button>
    </div>

    <!-- Form -->
    <form [formGroup]="form" (ngSubmit)="saveUser()" class="carbon-form bg-white rounded-xl shadow-sm p-4 border border-gray-100 space-y-4">
        <h6 class="section-title text-sm font-semibold text-gray-600 uppercase tracking-wide">User Information</h6>

        <!-- Row 1 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <div class="form-group">
                    <label class="block mb-1 text-sm font-medium text-gray-700">Name</label>
                    <input class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none" type="text" formControlName="name" placeholder="Enter full name" />
                    <small class="error text-red-600" *ngIf="f['name'].touched && f['name'].errors?.['required']">
                        Name is required.
                    </small>
                </div>
            </div>

            <div>
                <div class="form-group">
                    <label class="block mb-1 text-sm font-medium text-gray-700">Email</label>
                    <input class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none" type="email" formControlName="email" placeholder="Enter email" />
                    <small class="error text-red-600" *ngIf="f['email'].touched && f['email'].errors?.['required']">
                        Email is required.
                    </small>
                    <small class="error text-red-600" *ngIf="f['email'].touched && f['email'].errors?.['email']">
                        Please enter a valid email address.
                    </small>
                </div>
            </div>
        </div>

        <!-- Row 3 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-2">
            <div>
                <div class="form-group">
                    <label class="block mb-1 text-sm font-medium text-gray-700">Password</label>
                    <div class="password-field">
                        <input class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none" [type]="showPassword ? 'text' : 'password'" formControlName="password"
                            placeholder="Enter password" />
                        <i class="bi text-gray-500 cursor-pointer" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"
                            (click)="togglePasswordVisibility()"></i>
                    </div>

                    <small class="error text-red-600"
                        *ngIf="!isEditMode && f['password'].touched && f['password'].errors?.['required']">
                        Password is required.
                    </small>

                    <small class="error text-red-600" *ngIf="f['password'].touched && f['password'].errors?.['minlength']">
                        Password must be at least 6 characters.
                    </small>
                </div>
            </div>

            <div>
                <div class="form-group">
                    <label class="block mb-1 text-sm font-medium text-gray-700">Confirm Password</label>
                    <div class="password-field">
                        <input class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none" [type]="showConfirmPassword ? 'text' : 'password'" formControlName="password_confirm"
                            placeholder="Re-enter password" />
                        <i class="bi text-gray-500 cursor-pointer" [ngClass]="showConfirmPassword ? 'bi-eye-slash' : 'bi-eye'"
                            (click)="toggleConfirmPasswordVisibility()"></i>
                    </div>

                    <small class="error text-red-600"
                        *ngIf="!isEditMode && f['password_confirm'].touched && f['password_confirm'].errors?.['required']">
                        Confirm password is required.
                    </small>

                    <small class="error text-red-600" *ngIf="form.errors?.['passwordsMismatch'] && f['password_confirm'].touched">
                        Passwords do not match.
                    </small>
                </div>
            </div>
        </div>

        <!-- Row 2 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-2">
            <div>
                <div class="form-group">
                    <label class="block mb-1 text-sm font-medium text-gray-700">Role</label>
                    <select class="w-full border border-gray-300 rounded-lg px-3 py-2 bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none" formControlName="role_id">
                        <option value="" disabled>Select Role</option>
                        <option *ngFor="let r of roles" [ngValue]="r.id">{{ r.name }}</option>
                    </select>
                    <small class="error text-red-600" *ngIf="f['role_id'].touched && f['role_id'].errors?.['required']">
                        Role selection is required.
                    </small>
                </div>
            </div>
        </div>



        <!-- Action Buttons -->
        <div class="form-actions mt-5 flex justify-end gap-3">
            <button *ngIf="isEditMode" type="button" class="text-red-600 hover:text-red-700 hover:bg-red-50 px-4 py-2 rounded-lg transition duration-150" (click)="deleteUser()">
                Delete
            </button>

            <button type="button" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg transition duration-150" (click)="backToList()">
                Cancel
            </button>

            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg transition duration-150">
                {{ isEditMode ? 'Update' : 'Save' }}
            </button>
        </div>
    </form>
</div>
