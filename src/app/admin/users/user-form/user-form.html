<div class="user-form container-fluid py-4 px-5">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-semibold mb-0">
            {{ isEditMode ? 'Edit User' : 'Create User' }}
        </h3>
        <button class="btn btn-outline-secondary back-btn" (click)="backToList()">
            <i class="bi bi-arrow-left me-2"></i> Back
        </button>
    </div>

    <!-- Form -->
    <form [formGroup]="form" (ngSubmit)="saveUser()" class="carbon-form">
        <h6 class="section-title mb-4">User Information</h6>

        <!-- Row 1 -->
        <div class="row gx-5 gy-4">
            <div class="col-md-6">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" formControlName="name" placeholder="Enter full name" />
                    <small class="error" *ngIf="f['name'].touched && f['name'].errors?.['required']">
                        Name is required.
                    </small>
                </div>
            </div>

            <div class="col-md-6">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" formControlName="email" placeholder="Enter email" />
                    <small class="error" *ngIf="f['email'].touched && f['email'].errors?.['required']">
                        Email is required.
                    </small>
                    <small class="error" *ngIf="f['email'].touched && f['email'].errors?.['email']">
                        Please enter a valid email address.
                    </small>
                </div>
            </div>
        </div>

        <!-- Row 3 -->
        <div class="row gx-5 gy-4 mt-2">
            <div class="col-md-6">
                <div class="form-group">
                    <label>Password</label>
                    <div class="password-field">
                        <input [type]="showPassword ? 'text' : 'password'" formControlName="password"
                            placeholder="Enter password" />
                        <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"
                            (click)="togglePasswordVisibility()"></i>
                    </div>

                    <small class="error"
                        *ngIf="!isEditMode && f['password'].touched && f['password'].errors?.['required']">
                        Password is required.
                    </small>

                    <small class="error" *ngIf="f['password'].touched && f['password'].errors?.['minlength']">
                        Password must be at least 6 characters.
                    </small>
                </div>
            </div>

            <div class="col-md-6">
                <div class="form-group">
                    <label>Confirm Password</label>
                    <div class="password-field">
                        <input [type]="showConfirmPassword ? 'text' : 'password'" formControlName="password_confirm"
                            placeholder="Re-enter password" />
                        <i class="bi" [ngClass]="showConfirmPassword ? 'bi-eye-slash' : 'bi-eye'"
                            (click)="toggleConfirmPasswordVisibility()"></i>
                    </div>

                    <small class="error"
                        *ngIf="!isEditMode && f['password_confirm'].touched && f['password_confirm'].errors?.['required']">
                        Confirm password is required.
                    </small>

                    <small class="error" *ngIf="form.errors?.['passwordsMismatch'] && f['password_confirm'].touched">
                        Passwords do not match.
                    </small>
                </div>
            </div>
        </div>

        <!-- Row 2 -->
        <div class="row gx-5 gy-4 mt-2">
            <div class="col-md-6">
                <div class="form-group">
                    <label>Role</label>
                    <select formControlName="role_id">
                        <option value="" disabled>Select Role</option>
                        <option *ngFor="let r of roles" [ngValue]="r.id">{{ r.name }}</option>
                    </select>
                    <small class="error" *ngIf="f['role_id'].touched && f['role_id'].errors?.['required']">
                        Role selection is required.
                    </small>
                </div>
            </div>
        </div>



        <!-- Action Buttons -->
        <div class="form-actions mt-5 d-flex justify-content-end gap-3">
            <button *ngIf="isEditMode" type="button" class="btn btn-outline-danger" (click)="deleteUser()">
                Delete
            </button>

            <button type="button" class="btn btn-outline-secondary" (click)="backToList()">
                Cancel
            </button>

            <button type="submit" class="btn btn-primary">
                {{ isEditMode ? 'Update' : 'Save' }}
            </button>
        </div>

        <div *ngIf="message" class="alert alert-info text-center mt-4 small">
            {{ message }}
        </div>
    </form>
</div>
