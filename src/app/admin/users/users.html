<!-- <div class="admin-content-container"> -->
<div class="page-wrapper p-4 md:px-6 md:py-4 space-y-4">
  <!-- Header -->
  <div class="page-header flex justify-between items-center">
    <div>
      <h3 class="text-xl font-semibold text-gray-800 m-0">Users Management</h3>
      <small class="text-sm text-gray-500">Total users: <strong>{{ total }}</strong></small>
    </div>

    <button class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm transition duration-150"
      (click)="addUser()">
      <i class="bi bi-plus-lg mr-1"></i> Add User
    </button>
  </div>

  <!-- Users Table Card -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
    <div>
      <!-- Loading -->
      <div *ngIf="loading" class="py-10 flex justify-center">
        <div class="h-10 w-10 rounded-full border-4 border-indigo-200 border-t-indigo-600 animate-spin" role="status">
        </div>
      </div>

      <!-- Table -->
      <div class="overflow-x-auto" *ngIf="!loading">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50 text-gray-600 text-sm">
            <tr>
              <th class="px-4 py-3 text-left w-12">#</th>
              <th class="px-4 py-3 text-left">Name</th>
              <!-- <th>Last Name</th> -->
              <th class="px-4 py-3 text-left">Email</th>
              <th class="px-4 py-3 text-left">Role</th>
              <th class="px-4 py-3 text-left">Created at</th>
              <th class="px-4 py-3 text-right w-40">Actions</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-100 text-sm text-gray-700">
            <tr *ngFor="let user of users; index as i" class="hover:bg-gray-50 transition duration-150">
              <td class="px-4 py-3">{{ (page - 1) * 15 + i + 1 }}</td>
              <td class="px-4 py-3 font-medium">{{ user.name }}</td>
              <!-- <td>{{ user.last_name }}</td> -->
              <td class="px-4 py-3">{{ user.email }}</td>
              <td class="px-4 py-3">{{ user.role?.name || '—' }}</td>
              <td class="px-4 py-3">{{ user.createdAt | date: 'medium' }}</td>


              <!-- Actions -->
              <td class="px-4 py-3 text-right">
                <div class="flex justify-end gap-2">
                  <button [routerLink]="['/users', user.id, 'edit']" [disabled]="user.role?.name === 'Super Admin'"
                    [ngClass]="{
                      'text-blue-600 hover:text-blue-900': user.role?.name !== 'Super Admin',
                      'text-gray-300 cursor-not-allowed': user.role?.name === 'Super Admin'
                    }" title="Edit user">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                      stroke="currentColor" class="w-5 h-5">
                      <path stroke-linecap="round" stroke-linejoin="round"
                        d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
                    </svg>
                  </button>
                  <button
                   (click)="user.role?.name !== 'Super Admin' && deleteUser(user.id)"
                  [ngClass]="{
                      'text-red-600 hover:text-red-900': user.role?.name !== 'Super Admin',
                      'text-gray-300 cursor-not-allowed': user.role?.name === 'Super Admin'
                    }"
                    [attr.title]="user.role?.name === 'Super Admin' ? 'Super Admin cannot be deleted' : 'Delete user'">

                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                      stroke="currentColor" class="w-5 h-5">
                      <path stroke-linecap="round" stroke-linejoin="round"
                        d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                    </svg>
                  </button>
                </div>
              </td>
            </tr>

            <tr *ngIf="!users.length">
              <td colspan="6" class="px-4 py-10 text-center text-sm text-gray-500">No data found.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Footer Pagination -->
    <div class="flex justify-between items-center px-4 py-3 border-t border-gray-100 bg-white">
      <span class="text-sm text-gray-500">Page {{ page }} of {{ lastPage }}</span>
      <div class="flex items-center gap-2">
        <button
          class="px-3 py-1.5 rounded-lg text-sm font-medium border border-indigo-200 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 hover:border-indigo-300 transition duration-150 disabled:opacity-40 disabled:cursor-not-allowed"
          [disabled]="page === 1" (click)="prevPage()">
          ← Prev
        </button>
        <button
          class="px-3 py-1.5 rounded-lg text-sm font-medium border border-indigo-200 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 hover:border-indigo-300 transition duration-150 disabled:opacity-40 disabled:cursor-not-allowed"
          [disabled]="page === lastPage" (click)="nextPage()">
          Next →
        </button>
      </div>
    </div>
  </div>

  <!-- Message -->
  <div *ngIf="message"
    class="text-center text-sm text-indigo-700 bg-indigo-50 border border-indigo-100 rounded-lg py-2 px-3">
    {{ message }}
  </div>
</div>
<!-- </div> -->
