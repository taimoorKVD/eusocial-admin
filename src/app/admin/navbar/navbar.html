<header class="sa-navbar">
  <div class="sa-navbar__titles">
    <h1>{{ page.title }}</h1>
    <p>{{ page.subtitle }}</p>
  </div>

  <div class="sa-navbar__actions">
    <button type="button" class="sa-navbar__icon-btn" aria-label="Search" title="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.35-4.35m0 0A7.5 7.5 0 1 0 6 6a7.5 7.5 0 0 0 10.65 10.65Z"/>
      </svg>
    </button>

    <button type="button" class="sa-navbar__icon-btn sa-navbar__icon-btn--bell" aria-label="Notifications" title="Notifications">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0"/>
      </svg>
      <span class="sa-navbar__badge"></span>
    </button>

    <div class="relative profile-dropdown" *ngIf="user; else guest">
      <button
        type="button"
        class="sa-navbar__user"
        id="userDropdown"
        [attr.aria-expanded]="dropdownOpen"
        (click)="toggleDropdown()"
      >
        <span class="sa-navbar__avatar">{{ initials(displayName) }}</span>
        <span class="sa-navbar__user-meta">
          <strong>{{ displayName }}</strong>
          <small *ngIf="displayEmail">{{ displayEmail }}</small>
        </span>
        <svg class="sa-navbar__chevron" [class.is-open]="dropdownOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
        </svg>
      </button>

      <ul *ngIf="dropdownOpen" class="sa-navbar__menu" aria-labelledby="userDropdown">
        <li>
          <a routerLink="/profile" (click)="closeDropdown()">Profile</a>
        </li>
        <li><hr /></li>
        <li>
          <button type="button" class="is-danger" (click)="logout()">Logout</button>
        </li>
      </ul>
    </div>

    <ng-template #guest>
      <a class="sa-navbar__login" routerLink="/login">Login</a>
    </ng-template>
  </div>
</header>
