<div class="role-form container-fluid py-4 px-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-semibold mb-0">{{ isEditMode ? 'Edit Role' : 'Create Role' }}</h3>
        <button class="btn btn-outline-secondary back-btn" (click)="backToList()">
            <i class="bi bi-arrow-left me-2"></i> Back
        </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="saveRole()" class="carbon-form">
        <h6 class="section-title mb-4">Role Information</h6>

        <div class="row gx-5 gy-4">
            <div class="col-md-6">
                <div class="form-group">
                    <label>Role Name</label>
                    <input type="text" formControlName="name" placeholder="Enter role name" />
                    <small class="error" *ngIf="f['name'].touched && f['name'].errors?.['required']">
                        Role name is required.
                    </small>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <h6 class="section-title mb-3">Permissions</h6>

            <div class="row">
                <div class="col-md-6 mb-4" *ngFor="let group of permissions">
                    <h6 class="fw-semibold mb-3 text-primary">{{ group.module }} Module</h6>

                    <div *ngFor="let p of group.perms" class="form-check form-switch mb-2">
                        <input class="form-check-input" type="checkbox"
                            [checked]="form.value.permissions?.includes(p.id)"
                            (change)="togglePermission(p.id, $event.target.checked)" id="perm-{{ p.id }}" />
                        <label class="form-check-label" for="perm-{{ p.id }}">
                            {{ formatPermissionName(p.name) }}
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <div class="form-actions mt-5 d-flex justify-content-end gap-3">
            <button *ngIf="isEditMode" type="button" class="btn btn-outline-danger" (click)="deleteRole()">
                Delete
            </button>

            <button type="button" class="btn btn-outline-secondary" (click)="backToList()">
                Cancel
            </button>

            <button type="submit" class="btn btn-primary">
                {{ isEditMode ? 'Update' : 'Save' }}
            </button>
        </div>

        <div *ngIf="message" class="alert alert-info text-center mt-4 small">
            {{ message }}
        </div>
    </form>
</div>
