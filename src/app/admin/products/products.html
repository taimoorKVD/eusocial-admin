<div class="page-wrapper p-4 md:px-6 md:py-4 space-y-4">
    <!-- Header -->
    <div class="page-header flex justify-between items-center">
        <div>
            <h3 class="text-xl font-semibold text-gray-800 m-0">Product Management</h3>
            <small class="text-sm text-gray-500">Total products: <strong>{{ total }}</strong></small>
        </div>

        <button class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm transition duration-150" (click)="addProduct()">
            <i class="bi bi-plus-lg mr-1"></i> Add Product
        </button>
    </div>

    <ng-container *ngIf="loading || bulkDeleting">
        <app-eu-loader></app-eu-loader>
    </ng-container>

    <app-confirm-modal
      [isOpen]="showBulkDeleteConfirmModal"
      title="Delete Products"
      [description]="bulkDeleteConfirmDescription"
      confirmText="Delete"
      cancelText="Cancel"
      (confirmed)="onConfirmBulkDelete()"
      (closed)="closeBulkDeleteConfirmModal()">
    </app-confirm-modal>

    <div *ngIf="bulkSelection.hasSelection()" class="flex items-center justify-between gap-3 rounded-xl border border-gray-100 bg-white px-4 py-3 shadow-sm">
      <span class="text-sm text-gray-500">
        Selected: {{ bulkSelection.count() }}
      </span>
      <button
        type="button"
        class="inline-flex items-center gap-2 rounded-lg border border-red-500/30 bg-red-500/10 px-3 py-1.5 text-sm font-medium text-red-600 transition hover:bg-red-500/20 disabled:cursor-not-allowed disabled:opacity-40"
        [disabled]="!bulkSelection.hasSelection()"
        (click)="openBulkDeleteConfirm()">
        Bulk Delete
      </button>
    </div>

    <!-- Products Table -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <div>
            <!-- Table -->
            <div class="overflow-x-auto" *ngIf="!loading && products.length">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50 text-gray-600 text-sm">
                    <tr>
                        <th class="px-4 py-3 text-left w-10">
                          <input
                            type="checkbox"
                            class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-600"
                            [checked]="isAllSelected()"
                            [indeterminate]="isIndeterminate()"
                            [disabled]="selectableProductIds().length === 0"
                            (change)="toggleSelectAll()"
                          />
                        </th>
                        <th class="px-4 py-3 text-left">Name</th>
                        <th class="px-4 py-3 text-left">Price</th>
                        <th class="px-4 py-3 text-left">Image</th>
                        <th class="px-4 py-3 text-left">Created</th>
                        <th class="px-4 py-3 text-right w-40">Actions</th>
                    </tr>
                </thead>

                <tbody class="divide-y divide-gray-100 text-sm text-gray-700">
                    <tr *ngFor="let p of products" class="hover:bg-gray-50 transition duration-150" [class.bg-indigo-50]="isSelected(p)">
                        <td class="px-4 py-3 w-10">
                          <input
                            type="checkbox"
                            class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-600"
                            [checked]="isSelected(p)"
                            [disabled]="p?.id == null"
                            (change)="toggleSelect(p)"
                          />
                        </td>
                        <td class="px-4 py-3 font-medium">{{ p.name }}</td>
                        <td class="px-4 py-3">£{{ p.price | number: '1.2-2' }}</td>
                        <td class="px-4 py-3">
                            <img *ngIf="p.image" [src]="p.image.startsWith('/') ? (baseUrl + p.image) : p.image"
                                alt="Product" class="h-12 w-12 object-cover rounded-lg border border-gray-200 shadow-sm" width="50" height="50" />
                            <span *ngIf="!p.image" class="text-gray-400">—</span>
                        </td>
                        <td class="px-4 py-3">{{ p.createdAt | date: 'medium' }}</td>

                        <!-- Dropdown Actions -->
                        <td class="px-4 py-3 text-right">
                            <div class="flex justify-end gap-2">
                                <button [routerLink]="['/products', p.id, 'edit']" class="text-blue-600 hover:text-blue-900 transition duration-150" title="Edit product">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                                        stroke="currentColor" class="w-5 h-5">
                                        <path stroke-linecap="round" stroke-linejoin="round"
                                            d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
                                    </svg>
                                </button>
                                <button class="text-red-600 hover:text-red-900 transition duration-150" (click)="deleteProduct(p.id)" title="Delete product">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                                        stroke="currentColor" class="w-5 h-5">
                                        <path stroke-linecap="round" stroke-linejoin="round"
                                            d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                                    </svg>
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
            </div>

            <!-- Empty -->
            <div *ngIf="!loading && !products.length" class="py-10 text-center">
                <p class="text-sm text-gray-500">No data found.</p>
            </div>
        </div>

        <!-- Pagination -->
        <div class="flex justify-between items-center px-4 py-3 border-t border-gray-100 bg-white">
            <span class="text-sm text-gray-500">Page {{ page }} of {{ lastPage }}</span>
            <div class="flex items-center gap-2">
                <button class="px-3 py-1.5 rounded-lg text-sm font-medium border border-indigo-200 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 hover:border-indigo-300 transition duration-150 disabled:opacity-40 disabled:cursor-not-allowed" [disabled]="page === 1" (click)="prevPage()">
                    ← Prev
                </button>
                <button class="px-3 py-1.5 rounded-lg text-sm font-medium border border-indigo-200 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 hover:border-indigo-300 transition duration-150 disabled:opacity-40 disabled:cursor-not-allowed" [disabled]="page === lastPage" (click)="nextPage()">
                    Next →
                </button>
            </div>
        </div>
    </div>
</div>
