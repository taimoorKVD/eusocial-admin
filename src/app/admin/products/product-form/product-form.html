<div class="product-form container-fluid py-4 px-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-semibold mb-0">
            {{ isEditMode ? 'Edit Product' : 'Add Product' }}
        </h3>
        <button class="btn btn-outline-secondary" (click)="backToList()">
            <i class="bi bi-arrow-left me-2"></i> Back
        </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="saveProduct()" novalidate>
        <div class="row gx-4 gy-3">
            <div class="col-md-6">
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" formControlName="name" placeholder="Enter product name" />
                    <small class="error" *ngIf="f['name'].touched && f['name'].hasError('required')">
                        Product name is required.
                    </small>
                </div>
            </div>

            <div class="col-md-6">
                <div class="form-group">
                    <label>Price</label>
                    <input type="number" formControlName="price" placeholder="Enter price" />
                    <small class="error" *ngIf="f['price'].touched && f['price'].hasError('required')">
                        Price is required.
                    </small>
                    <small class="error" *ngIf="f['price'].hasError('min')">
                        Price must be greater than 0.
                    </small>
                </div>
            </div>

            <div class="col-12">
                <div class="form-group">
                    <label>Description</label>
                    <textarea rows="3" formControlName="description" placeholder="Enter description"></textarea>
                </div>
            </div>

            <div class="col-md-6">
                <div class="form-group">
                    <label>Product Image</label>
                    <input type="file" accept="image/*" (change)="onFileChange($event)" />
                </div>
            </div>

            <div class="col-md-6" *ngIf="imagePreview">
                <div class="image-preview text-center">
                    <img [src]="imagePreview" class="img-thumbnail rounded shadow-sm" alt="Preview" />
                </div>
            </div>
        </div>

        <div class="form-actions mt-5 d-flex justify-content-end gap-3">
            <button type="button" class="btn btn-outline-secondary" (click)="backToList()">
                Cancel
            </button>
            <button type="submit" class="btn btn-primary" [disabled]="loading">
                {{ isEditMode ? 'Update' : 'Save' }}
            </button>
        </div>

        <div *ngIf="message" class="alert alert-info mt-4 text-center small">
            {{ message }}
        </div>
    </form>
</div>
