<div class="container mt-5" *ngIf="!loading; else loadingTpl">
  <div class="card shadow-sm p-4">
    <!-- Display section -->
    <div class="d-flex align-items-center mb-3">
      <img
        src="assets/no-image.png"
        class="rounded-circle me-3"
        width="70"
        height="70"
        alt="Profile"
      />
      <div>
        <h4 class="mb-0">{{ user?.first_name }} {{ user?.last_name }}</h4>
        <p class="text-muted mb-0">{{ user?.email }}</p>
      </div>
    </div>

    <hr />

    <p><strong>Role:</strong> {{ user?.role || 'User' }}</p>

    <hr class="my-4" />

    <!-- Update Form -->
    <h5 class="mb-3">Update Profile</h5>

    <form [formGroup]="form" (ngSubmit)="saveProfile()">
      <div class="mb-3">
        <label class="form-label">First Name</label>
        <input
          type="text"
          class="form-control"
          formControlName="first_name"
          placeholder="Enter first name"
        />
        <div class="text-danger" *ngIf="form.get('first_name')?.touched && form.get('first_name')?.invalid">
          First name is required.
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Last Name</label>
        <input
          type="text"
          class="form-control"
          formControlName="last_name"
          placeholder="Enter last name"
        />
        <div class="text-danger" *ngIf="form.get('last_name')?.touched && form.get('last_name')?.invalid">
          Last name is required.
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input
          type="email"
          class="form-control"
          formControlName="email"
          placeholder="Enter email address"
        />
        <div class="text-danger" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
          Please enter a valid email.
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">New Password</label>
        <input
          type="password"
          class="form-control"
          formControlName="password"
          placeholder="Leave blank to keep current password"
        />
      </div>

      <div class="mb-3">
        <label class="form-label">Confirm Password</label>
        <input
          type="password"
          class="form-control"
          formControlName="password_confirm"
          placeholder="Confirm new password"
        />
      </div>

      <button class="btn btn-primary" type="submit" [disabled]="saving || form.invalid">
        {{ saving ? 'Saving...' : 'Save Changes' }}
      </button>
    </form>

    <div class="mt-3 text-center" *ngIf="message">
      <small>{{ message }}</small>
    </div>
  </div>
</div>

<ng-template #loadingTpl>
  <div class="d-flex justify-content-center align-items-center vh-100">
    <div class="spinner-border text-primary" role="status"></div>
  </div>
</ng-template>
