<nav class="sa-sidebar">
  <div class="sa-sidebar__brand">
    <img src="assets/eusocial-logo-02.png" alt="Eusocial Logo" class="sa-sidebar__logo" />
  </div>

  <div class="sa-sidebar__scroll">
    <ul class="sa-sidebar__list">
      <li *ngFor="let link of topLinks">
        <a
          class="sa-sidebar__link"
          [routerLink]="link.route"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: !!link.exact }"
        >
          <ng-container *ngTemplateOutlet="iconTpl; context: { $implicit: link.icon }"></ng-container>
          <span>{{ link.label }}</span>
        </a>
      </li>
    </ul>

    <div class="sa-sidebar__group" *ngFor="let group of groups">
      <div class="sa-sidebar__heading">{{ group.title }}</div>
      <ul class="sa-sidebar__list">
        <li *ngFor="let link of group.links">
          <a
            *ngIf="!link.comingSoon && link.route; else soonLink"
            class="sa-sidebar__link"
            [routerLink]="link.route"
            routerLinkActive="is-active"
          >
            <ng-container *ngTemplateOutlet="iconTpl; context: { $implicit: link.icon }"></ng-container>
            <span>{{ link.label }}</span>
          </a>
          <ng-template #soonLink>
            <span class="sa-sidebar__link is-disabled" title="Coming soon">
              <ng-container *ngTemplateOutlet="iconTpl; context: { $implicit: link.icon }"></ng-container>
              <span>{{ link.label }}</span>
            </span>
          </ng-template>
        </li>
      </ul>
    </div>
  </div>

  <a class="sa-sidebar__profile" routerLink="/profile">
    <span class="sa-sidebar__avatar">{{ initials(displayName) }}</span>
    <span class="sa-sidebar__profile-meta">
      <strong>{{ displayName }}</strong>
      <small>{{ roleLabel }}</small>
    </span>
    <svg class="sa-sidebar__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
    </svg>
  </a>
</nav>
