<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
    <div class="flex justify-center mb-6">
      <img alt="Eusocial Logo"
           class="h-16 object-contain"
           src="assets/eusocial-logo.png" />
    </div>

    <h3 class="text-xl font-semibold text-center mb-2">Reset Password</h3>

    <div *ngIf="verifying" class="text-sm text-gray-500 text-center mb-4">
      Verifying reset link...
    </div>
    <div *ngIf="!verifying && !tokenValid"
         class="text-sm text-red-500 text-center mb-4">
      Reset link is invalid or expired.
    </div>

    <form (ngSubmit)="onSubmit()"
          [formGroup]="form"
          *ngIf="tokenValid && !verifying">
      <div class="form-group">
        <label for="email">
          Email
          <span class="required">*</span>
        </label>
        <input class="form-control"
               formControlName="email"
               id="email"
               readonly
               type="email" />
      </div>

      <div class="form-group">
        <label for="password">
          New Password
          <span class="required">*</span>
        </label>
        <input class="form-control"
               formControlName="password"
               id="password"
               placeholder="Enter new password"
               type="password" />
        <div *ngIf="submitted && f['password']?.errors" class="error">
          <small *ngIf="f['password']?.errors?.['required']">
            Password is required.
          </small>
          <small *ngIf="f['password']?.errors?.['minlength']">
            Minimum 6 characters.
          </small>
        </div>
      </div>

      <div class="form-group">
        <label for="password_confirm">
          Confirm Password
          <span class="required">*</span>
        </label>
        <input class="form-control"
               formControlName="password_confirm"
               id="password_confirm"
               placeholder="Confirm new password"
               type="password" />
        <div *ngIf="submitted && f['password_confirm']?.errors" class="error">
          <small *ngIf="f['password_confirm']?.errors?.['required']">
            Confirm Password is required.
          </small>
        </div>
      </div>

      <button [disabled]="loading" class="btn-login" type="submit">
        {{ loading ? 'Resetting...' : 'Reset Password' }}
      </button>

      <p class="back-link mt-3">
        <a routerLink="/login">Back to Login</a>
      </p>
    </form>
  </div>
</div>
