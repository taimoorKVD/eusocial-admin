<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
    <div class="flex justify-center mb-6">
      <img alt="Eusocial Logo"
           class="h-16 object-contain"
           src="assets/eusocial-logo.png" />
    </div>

    <h3 class="text-xl font-semibold text-center mb-2">Forgot Password</h3>

    <form (ngSubmit)="onSubmit()" [formGroup]="form">
      <div class="form-group">
        <label for="email">
          Email
          <span class="required">*</span>
        </label>
        <input class="form-control"
               formControlName="email"
               id="email"
               placeholder="Enter your email"
               type="email" />
        <div *ngIf="submitted && f['email']?.errors" class="error">
          <small *ngIf="f['email']?.errors?.['required']">
            Email is required.
          </small>
          <small *ngIf="f['email']?.errors?.['email']">
            Enter a valid email.
          </small>
        </div>
      </div>

      <button [disabled]="loading" class="btn-login" type="submit">
        {{ loading ? 'Sending…' : 'Send Reset Link' }}
      </button>

      <div class="forgot-password">
        <a routerLink="/login">Back to Login</a>
      </div>
    </form>
  </div>
</div>
